<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies - MovieMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-film"></i> MovieMate</a>
            <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="movies.html">Movies</a></li>
                    <li class="nav-item"><a class="nav-link" href="theatres.html">Theatres</a></li>
                </ul>
                <ul class="navbar-nav align-items-center" id="navAuthSection"></ul>
            </div>
        </div>
    </nav>

    <!-- Header & Filter Section -->
    <div class="bg-black py-4 border-bottom border-secondary">
        <div class="container">
            <h2 class="fw-bold mb-3"><i class="bi bi-collection-play text-danger"></i> Explore Movies</h2>
            <div class="row g-2 align-items-center">
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-dark text-light border-secondary"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control bg-dark text-light border-secondary" placeholder="Search by title, cast, or director...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select id="genreSelect" class="form-select bg-dark text-light border-secondary">
                        <option value="">All Genres</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="statusSelect" class="form-select bg-dark text-light border-secondary">
                        <option value="">All Statuses</option>
                        <option value="Now Showing">Now Showing</option>
                        <option value="Upcoming">Upcoming</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-cinema w-100" id="btnFilter"><i class="bi bi-funnel"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Movies Grid -->
    <main class="container my-5">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="moviesContainer">
            <div class="col-12 text-center text-muted py-5">
                <div class="spinner-border text-danger" role="status"></div>
                <p class="mt-2">Loading movies...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center">
        <div class="container">
            <p class="mb-1 text-light fw-bold"><i class="bi bi-film text-danger"></i> MovieMate - Movie Ticket Booking System</p>
            <p class="small mb-0">Final Year Academic Project | ASP.NET Core &amp; SQL Server &amp; Bootstrap 5</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Read URL Query params
            const urlParams = new URLSearchParams(window.location.search);
            const searchParam = urlParams.get('search') || '';
            const genreParam = urlParams.get('genreId') || '';
            const statusParam = urlParams.get('status') || '';

            if (searchParam) document.getElementById('searchInput').value = searchParam;
            if (statusParam) document.getElementById('statusSelect').value = statusParam;

            await loadGenresDropdown(genreParam);
            await fetchAndRenderMovies();

            document.getElementById('btnFilter').addEventListener('click', fetchAndRenderMovies);
            document.getElementById('searchInput').addEventListener('keyup', (e) => {
                if (e.key === 'Enter') fetchAndRenderMovies();
            });
            document.getElementById('genreSelect').addEventListener('change', fetchAndRenderMovies);
            document.getElementById('statusSelect').addEventListener('change', fetchAndRenderMovies);
        });

        async function loadGenresDropdown(selectedGenreId) {
            try {
                const genres = await apiCall('/genres');
                const select = document.getElementById('genreSelect');
                genres.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.id;
                    opt.innerText = g.name;
                    if (selectedGenreId && selectedGenreId == g.id) opt.selected = true;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchAndRenderMovies() {
            const search = document.getElementById('searchInput').value.trim();
            const genreId = document.getElementById('genreSelect').value;
            const status = document.getElementById('statusSelect').value;

            const params = new URLSearchParams();
            if (search) params.append('search', search);
            if (genreId) params.append('genreId', genreId);
            if (status) params.append('status', status);

            const container = document.getElementById('moviesContainer');
            container.innerHTML = `<div class="col-12 text-center text-muted py-5"><div class="spinner-border text-danger"></div></div>`;

            try {
                const movies = await apiCall(`/movies?${params.toString()}`);
                if (!movies || movies.length === 0) {
                    container.innerHTML = `<div class="col-12 text-center text-muted py-5"><i class="bi bi-film fs-1"></i><p class="mt-2">No movies match your search or filter.</p></div>`;
                    return;
                }

                container.innerHTML = movies.map(m => `
                    <div class="col">
                        <div class="movie-card">
                            <img src="${m.posterUrl}" class="movie-poster" alt="${m.title}" onerror="this.src='images/default_poster.svg'">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="badge badge-rating"><i class="bi bi-star-fill"></i> ${m.rating > 0 ? m.rating.toFixed(1) : 'NR'}</span>
                                    <span class="text-muted small">${m.language}</span>
                                </div>
                                <h5 class="card-title text-truncate fw-bold mb-1" title="${m.title}">${m.title}</h5>
                                <p class="text-muted small mb-2 text-truncate">${m.director ? 'Dir: ' + m.director : ''}</p>
                                <div class="mb-3">
                                    ${m.genres.map(g => `<span class="badge badge-genre">${g.name}</span>`).join('')}
                                </div>
                                <div class="mt-auto">
                                    <a href="movie-details.html?id=${m.id}" class="btn btn-cinema w-100 btn-sm">
                                        <i class="bi bi-ticket-perforated"></i> ${m.status === 'Now Showing' ? 'Book Tickets' : 'View Details'}
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<div class="col-12 text-center text-danger py-5"><p>${err.message}</p></div>`;
            }
        }
    </script>
</body>
</html>
