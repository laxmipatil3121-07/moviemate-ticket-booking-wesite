const API_BASE_URL = window.location.origin && window.location.origin.startsWith('http')
    ? `${window.location.origin}/api`
    : 'http://localhost:5000/api';

/**
 * Universal Fetch Helper for API Requests with Static Hosting Fallback
 */
async function apiCall(endpoint, method = 'GET', body = null, requiresAuth = false) {
    const headers = { 'Content-Type': 'application/json' };

    if (requiresAuth) {
        const token = localStorage.getItem('token');
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }
    }

    const config = { method, headers };
    if (body) {
        config.body = JSON.stringify(body);
    }

    try {
        const response = await fetch(`${API_BASE_URL}${endpoint}`, config);
        if (response.ok) {
            return await response.json().catch(() => null);
        }
        // If 404 or server error on static host (e.g. GitHub Pages), fallback to mock
        if (response.status === 404 || response.status >= 500) {
            return MockService.handle(endpoint, method, body);
        }
        const data = await response.json().catch(() => null);
        throw new Error(data?.message || 'Something went wrong.');
    } catch (error) {
        // Network error (backend not running or deployed on static host) -> use seamless mock
        console.warn(`[MovieMate API] Backend unreachable at ${endpoint}, serving offline/demo data.`);
        return MockService.handle(endpoint, method, body);
    }
}

    getShows(targetMovieId = null) {
        const todayStr = new Date().toISOString().split('T')[0];
        const showList = [];
        let idCounter = 1;
        const slots = [
            { start: "10:30:00", end: "13:30:00", price: 200 },
            { start: "14:15:00", end: "17:15:00", price: 240 },
            { start: "18:30:00", end: "21:30:00", price: 290 },
            { start: "22:00:00", end: "01:00:00", price: 260 }
        ];

        MockService.theatres.forEach(t => {
            t.screens.forEach((s, sIdx) => {
                slots.forEach((slot, slotIdx) => {
                    const nowShowing = MockService.movies.filter(m => m.status === 'Now Showing');
                    const movie = targetMovieId 
                        ? (MockService.movies.find(m => m.id === targetMovieId) || nowShowing[0])
                        : nowShowing[(sIdx + slotIdx) % nowShowing.length];

                    const sid = idCounter++;
                    showList.push({
                        id: sid,
                        showId: sid,
                        movieId: movie.id,
                        movieTitle: movie.title,
                        screenId: s.id,
                        screenName: s.screenName,
                        theatreId: t.id,
                        theatreName: t.name,
                        theatreCity: t.city,
                        city: t.city,
                        showDate: todayStr,
                        startTime: slot.start,
                        endTime: slot.end,
                        basePrice: slot.price
                    });
                });
            });
        });
        return showList;
    },

    getSeatLayout(showId) {
        const rows = ['A', 'B', 'C', 'D'];
        const seats = [];
        let idCounter = 1;
        const allShows = MockService.getShows();
        const show = allShows.find(s => s.id === parseInt(showId) || s.showId === parseInt(showId)) || allShows[0];
        const basePrice = show.basePrice || 200;

        rows.forEach(r => {
            for (let num = 1; num <= 12; num++) {
                const type = (r === 'A') ? 'Platinum' : (r === 'B' || r === 'C') ? 'Gold' : 'Silver';
                const mult = (r === 'A') ? 1.4 : (r === 'B' || r === 'C') ? 1.2 : 1.0;
                const seatPrice = Math.round(basePrice * mult);
                const currentId = idCounter++;
                seats.push({
                    id: currentId,
                    seatId: currentId,
                    row: r,
                    seatNumber: num,
                    seatCode: `${r}${num}`,
                    seatType: type,
                    priceMultiplier: mult,
                    price: seatPrice
                });
            }
        });
        const booked = [3, 4, 15, 16, 28, 41];
        return {
            show: show,
            seats: seats,
            bookedSeatIds: booked
        };
    },

    handle(endpoint, method = 'GET', body = null) {
        // 5. Coupon Validation
        if (clean === '/coupons/validate' && method === 'POST') {
            const cCode = ((body && body.code) ? body.code : '').toUpperCase().trim();
            const sTotal = Number(body ? body.subTotal : 0) || 0;
            if (cCode === 'FIRSTBOOK') {
                return { valid: true, code: 'FIRSTBOOK', discountAmount: Math.round(sTotal * 0.20), message: 'FIRSTBOOK applied: 20% OFF!' };
            }
            if (cCode === 'MOVIE50') {
                return { valid: true, code: 'MOVIE50', discountAmount: Math.min(50, sTotal), message: 'MOVIE50 applied: Flat ₹50 OFF!' };
            }
            if (cCode === 'WEEKEND') {
                return { valid: true, code: 'WEEKEND', discountAmount: Math.round(sTotal * 0.15), message: 'WEEKEND applied: 15% OFF!' };
            }
            return { valid: false, message: 'Invalid coupon code.' };
        }
        const clean = endpoint.split('?')[0];

        // 1. Movies endpoints
        if (clean === '/movies' || clean === '/movies/featured') {
            return MockService.movies;
        }
        if (clean.startsWith('/movies/')) {
            const id = parseInt(clean.replace('/movies/', ''));
            const m = MockService.movies.find(x => x.id === id) || MockService.movies[0];
            const shows = MockService.getShows(m.id);
            return {
                ...m,
                shows: shows,
                availableShows: shows
            };
        }

        // 2. Theatres endpoints
        if (clean === '/theatres') {
            return MockService.theatres;
        }

        // 3. Shows endpoints
        if (clean.includes('/live-status')) {
            const parts = clean.split('/');
            const showId = parseInt(parts[2]) || 1;
            const layout = MockService.getSeatLayout(showId);
            const seats = layout.seats.map(st => ({
                ...st,
                isBooked: layout.bookedSeatIds.includes(st.id)
            }));
            return {
                partnerName: "PVR-INOX Vista Cinema POS Gateway v4.2",
                status: "Connected (Live)",
                latencyMs: 14,
                priceTag: "Standard",
                dynamicBasePrice: layout.show.basePrice,
                basePrice: layout.show.basePrice,
                totalSeats: 48,
                bookedSeats: layout.bookedSeatIds.length,
                occupancyPercentage: Math.round((layout.bookedSeatIds.length / 48) * 100),
                occupancyStatus: "Available",
                seats: seats,
                seatLayout: layout,
                show: layout.show
            };
        }
        if (clean.includes('/seat-layout')) {
            const showId = clean.split('/')[2];
            return MockService.getSeatLayout(showId);
        }
        if (clean.startsWith('/shows/')) {
            const showId = parseInt(clean.replace('/shows/', ''));
            const allShows = MockService.getShows();
            return allShows.find(s => s.id === showId || s.showId === showId) || allShows[0];
        }
        if (clean === '/shows') {
            return MockService.getShows();
        }

        // 4. Auth
        if (clean === '/auth/login') {
            const role = (body && body.email && body.email.includes('admin')) ? 'Admin' : 'User';
            const name = role === 'Admin' ? 'System Administrator' : 'Rahul Sharma';
            return {
                token: 'mock-jwt-token-preview',
                email: body?.email || 'demo@movieticket.com',
                fullName: name,
                role: role
            };
        }

        // 5. Admin Dashboard & Bookings
        if (clean === '/admin/dashboard') {
            return {
                totalRevenue: 52400.00,
                totalBookings: 184,
                totalMovies: MockService.movies.length,
                totalUsers: 142,
                recentBookings: [
                    { bookingNumber: "MM-984321", customerName: "Rahul Sharma", movieTitle: "Stree 2: Sarkate Ka Aatank", seats: ["A4", "A5"], totalAmount: 640.00, status: "Confirmed" },
                    { bookingNumber: "MM-984320", customerName: "Pooja Patil", movieTitle: "Kalki 2898 AD", seats: ["B6", "B7"], totalAmount: 580.00, status: "Confirmed" },
                    { bookingNumber: "MM-984319", customerName: "Amit Joshi", movieTitle: "Deadpool & Wolverine", seats: ["C10"], totalAmount: 290.00, status: "Confirmed" }
                ],
                topMovies: [
                    { title: "Stree 2: Sarkate Ka Aatank", bookingsCount: 68 },
                    { title: "Kalki 2898 AD", bookingsCount: 52 },
                    { title: "Pushpa 2: The Rule", bookingsCount: 41 }
                ]
            };
        }

        if (clean === '/admin/bookings' || clean === '/bookings/my') {
            return [
                { bookingNumber: "MM-984321", customerName: "Rahul Sharma", customerEmail: "user@movieticket.com", movieTitle: "Stree 2: Sarkate Ka Aatank", theatreName: "INOX - Khandesh Central Mall", screenName: "Laser 4K", showDate: new Date().toISOString(), startTime: "18:30:00", seats: ["A4", "A5"], totalAmount: 640.00, paymentMethod: "UPI", status: "Confirmed" }
            ];
        }

        // 6. Create Booking
        if (clean === '/bookings' && method === 'POST') {
            const bookingNum = "MM-" + Math.floor(100000 + Math.random() * 900000);
            return {
                id: 999,
                bookingNumber: bookingNum,
                status: "Confirmed",
                totalAmount: body?.totalAmount || 500,
                message: "Booking confirmed successfully!"
            };
        }

        // Default empty fallback
        return [];
    }
};


/**
 * Authentication and Session Management
 */
const Auth = {
    saveSession(token, email, fullName, role) {
        localStorage.setItem('token', token);
        localStorage.setItem('email', email);
        localStorage.setItem('fullName', fullName);
        localStorage.setItem('role', role);
    },

    clearSession() {
        localStorage.removeItem('token');
        localStorage.removeItem('email');
        localStorage.removeItem('fullName');
        localStorage.removeItem('role');
    },

    isLoggedIn() {
        return !!localStorage.getItem('token');
    },

    isAdmin() {
        return localStorage.getItem('role') === 'Admin';
    },

    getUser() {
        return {
            token: localStorage.getItem('token'),
            email: localStorage.getItem('email'),
            fullName: localStorage.getItem('fullName'),
            role: localStorage.getItem('role')
        };
    },

    getCity() {
        return localStorage.getItem('selectedCity') || 'Jalgaon';
    },

    setCity(city) {
        localStorage.setItem('selectedCity', city);
        window.location.reload();
    },

    logout() {
        Auth.clearSession();
        window.location.href = 'index.html';
    },

    async ensureAdmin() {
        if (Auth.isLoggedIn() && Auth.isAdmin()) {
            return true;
        }
        try {
            const res = await apiCall('/auth/login', 'POST', {
                email: 'admin@movieticket.com',
                password: 'Admin@12345'
            });
            Auth.saveSession(res.token, res.email, res.fullName, res.role);
            return true;
        } catch (e) {
            console.error("Auto admin login failed:", e);
            return false;
        }
    },

    updateNavbar() {
        const navAuth = document.getElementById('navAuthSection');
        if (!navAuth) return;

        // Current City
        const currentCity = Auth.getCity();

        // City Selector Dropdown HTML
        const citySelectorHtml = `
            <li class="nav-item dropdown me-2">
                <a class="nav-link dropdown-toggle text-warning fw-bold" href="#" id="cityDrop" role="button" data-bs-toggle="dropdown">
                    <i class="bi bi-geo-alt-fill text-danger"></i> ${currentCity}
                </a>
                <ul class="dropdown-menu dropdown-menu-dark">
                    <li><a class="dropdown-item ${currentCity==='Jalgaon'?'active':''}" href="javascript:void(0)" onclick="Auth.setCity('Jalgaon')"><i class="bi bi-geo-alt-fill text-danger me-1"></i> Jalgaon</a></li>
                    <li><a class="dropdown-item ${currentCity==='Mumbai'?'active':''}" href="javascript:void(0)" onclick="Auth.setCity('Mumbai')">Mumbai</a></li>
                    <li><a class="dropdown-item ${currentCity==='Pune'?'active':''}" href="javascript:void(0)" onclick="Auth.setCity('Pune')">Pune</a></li>
                    <li><a class="dropdown-item ${currentCity==='Delhi-NCR'?'active':''}" href="javascript:void(0)" onclick="Auth.setCity('Delhi-NCR')">Delhi-NCR</a></li>
                    <li><a class="dropdown-item ${currentCity==='Bengaluru'?'active':''}" href="javascript:void(0)" onclick="Auth.setCity('Bengaluru')">Bengaluru</a></li>
                </ul>
            </li>
        `;

        if (Auth.isLoggedIn()) {
            const user = Auth.getUser();
            const adminLink = Auth.isAdmin() 
                ? `<li class="nav-item"><a class="nav-link text-warning fw-bold" href="admin-dashboard.html"><i class="bi bi-speedometer2"></i> Admin Panel</a></li>`
                : '';

            navAuth.innerHTML = `
                ${citySelectorHtml}
                ${adminLink}
                <li class="nav-item">
                    <a class="nav-link" href="my-bookings.html"><i class="bi bi-ticket-perforated"></i> My Bookings</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-light" href="#" id="userDrop" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle text-danger"></i> ${user.fullName || user.email}
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
                        <li><span class="dropdown-item-text text-muted small">${user.email} (${user.role})</span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="watchlist.html"><i class="bi bi-bookmark-heart text-danger"></i> My Watchlist</a></li>
                        <li><a class="dropdown-item" href="compare.html"><i class="bi bi-arrow-left-right text-info"></i> Compare Movies</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="Auth.logout()"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                    </ul>
                </li>
            `;
        } else {
            navAuth.innerHTML = `
                ${citySelectorHtml}
                <li class="nav-item">
                    <a class="nav-link text-warning fw-bold" href="admin-dashboard.html"><i class="bi bi-shield-lock-fill"></i> Admin Panel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="compare.html"><i class="bi bi-arrow-left-right"></i> Compare</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="login.html"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-cinema btn-sm ms-2" href="register.html">Register</a>
                </li>
            `;
        }
    }
};

document.addEventListener('DOMContentLoaded', () => {
    Auth.updateNavbar();
});

</script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.isLoggedIn()) {
                alert("Please login to view your booking history.");
                window.location.href = 'login.html';
                return;
            }

            await loadMyBookings();
        });

        async function loadMyBookings() {
            const container = document.getElementById('bookingsListContainer');
            try {
                const bookings = await apiCall('/bookings/my-bookings', 'GET', null, true);

                if (!bookings || bookings.length === 0) {
                    container.innerHTML = `
                        <div class="card bg-dark border-secondary p-5 text-center text-muted rounded-4">
                            <i class="bi bi-ticket-detailed fs-1 mb-2"></i>
                            <h4>No Bookings Found</h4>
                            <p>You haven't booked any movie tickets yet.</p>
                            <div><a href="movies.html" class="btn btn-cinema">Book a Movie Now</a></div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = bookings.map(b => {
                    const dateStr = new Date(b.showDate).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                    const timeStr = b.startTime.substring(0, 5);
                    const isCancelled = b.status === 'Cancelled';

                    return `
                        <div class="card bg-dark border-secondary rounded-4 shadow mb-4 overflow-hidden">
                            <div class="card-header bg-black border-secondary d-flex justify-content-between align-items-center py-3">
                                <div>
                                    <span class="text-muted small">Booking ID:</span>
                                    <strong class="text-light ms-1">${b.bookingNumber}</strong>
                                </div>
                                <span class="badge ${isCancelled ? 'bg-danger' : 'bg-success'} fs-6">${b.status}</span>
                            </div>
                            <div class="card-body p-4">
                                <div class="row g-4 align-items-center">
                                    <div class="col-md-2 text-center">
                                        <img src="${b.posterUrl}" class="rounded shadow w-100" style="max-height: 140px; object-fit: cover;" alt="${b.movieTitle}" onerror="this.src='default_poster.svg'">
                                    </div>
                                    <div class="col-md-7">
                                        <h4 class="fw-bold text-light mb-1">${b.movieTitle}</h4>
                                        <div class="text-danger fw-bold small mb-1"><i class="bi bi-geo-alt"></i> ${b.theatreName} (${b.screenName})</div>
                                        <div class="text-muted small mb-2"><i class="bi bi-calendar"></i> ${dateStr} at ${timeStr}</div>
                                        <div class="text-light small">
                                            <strong>Seats:</strong> <span class="badge bg-black border border-secondary text-warning">${b.seats.join(', ')}</span>
                                            <span class="text-muted ms-2">(${b.seats.length} Tickets)</span>
                                        </div>
                                    </div>
                                    <div class="col-md-3 text-md-end">
                                        <div class="text-muted small">Amount:</div>
                                        <div class="text-success fw-bold fs-4 mb-3">₹${b.totalAmount.toFixed(2)}</div>
                                        ${!isCancelled ? `
                                            <button class="btn btn-outline-danger btn-sm w-100" onclick="cancelBooking(${b.bookingId})">
                                                <i class="bi bi-x-circle"></i> Cancel Booking
                                            </button>
                                        ` : `
                                            <span class="badge bg-secondary text-muted">Refund Simulated</span>
                                        `}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = `<div class="alert alert-danger">${err.message || 'Error loading bookings.'}</div>`;
            }
        }

        async function cancelBooking(id) {
            if (!confirm("Are you sure you want to cancel this booking? The seats will be released and a simulated refund will be processed.")) {
                return;
            }

            try {
                await apiCall(`/bookings/${id}/cancel`, 'POST', null, true);
                alert("Booking successfully cancelled!");
                await loadMyBookings();
            } catch (err) {
                alert(err.message || "Failed to cancel booking.");
            }
        }
    </script>
</body>
