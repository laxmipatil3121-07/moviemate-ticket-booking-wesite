<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - MovieMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-film"></i> MovieMate</a>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="movies.html">Movies</a></li>
                    <li class="nav-item"><a class="nav-link" href="theatres.html">Theatres</a></li>
                </ul>
                <ul class="navbar-nav align-items-center" id="navAuthSection"></ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="fw-bold text-light mb-4"><i class="bi bi-ticket-perforated text-danger"></i> My Booking History</h2>

        <div id="bookingsListContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-danger"></div>
                <p class="text-muted mt-2">Loading your booking history...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.isLoggedIn()) {
                alert("Please login to view your booking history.");
                window.location.href = 'login.html';
                return;
            }

            await loadMyBookings();
        });

        async function loadMyBookings() {
            const container = document.getElementById('bookingsListContainer');
            try {
                const bookings = await apiCall('/bookings/my-bookings', 'GET', null, true);

                if (!bookings || bookings.length === 0) {
                    container.innerHTML = `
                        <div class="card bg-dark border-secondary p-5 text-center text-muted rounded-4">
                            <i class="bi bi-ticket-detailed fs-1 mb-2"></i>
                            <h4>No Bookings Found</h4>
                            <p>You haven't booked any movie tickets yet.</p>
                            <div><a href="movies.html" class="btn btn-cinema">Book a Movie Now</a></div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = bookings.map(b => {
                    const dateStr = new Date(b.showDate).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                    const timeStr = b.startTime.substring(0, 5);
                    const isCancelled = b.status === 'Cancelled';

                    return `
                        <div class="card bg-dark border-secondary rounded-4 shadow mb-4 overflow-hidden">
                            <div class="card-header bg-black border-secondary d-flex justify-content-between align-items-center py-3">
                                <div>
                                    <span class="text-muted small">Booking ID:</span>
                                    <strong class="text-light ms-1">${b.bookingNumber}</strong>
                                </div>
                                <span class="badge ${isCancelled ? 'bg-danger' : 'bg-success'} fs-6">${b.status}</span>
                            </div>
                            <div class="card-body p-4">
                                <div class="row g-4 align-items-center">
                                    <div class="col-md-2 text-center">
                                        <img src="${b.posterUrl}" class="rounded shadow w-100" style="max-height: 140px; object-fit: cover;" alt="${b.movieTitle}" onerror="this.src='images/default_poster.svg'">
                                    </div>
                                    <div class="col-md-7">
                                        <h4 class="fw-bold text-light mb-1">${b.movieTitle}</h4>
                                        <div class="text-danger fw-bold small mb-1"><i class="bi bi-geo-alt"></i> ${b.theatreName} (${b.screenName})</div>
                                        <div class="text-muted small mb-2"><i class="bi bi-calendar"></i> ${dateStr} at ${timeStr}</div>
                                        <div class="text-light small">
                                            <strong>Seats:</strong> <span class="badge bg-black border border-secondary text-warning">${b.seats.join(', ')}</span>
                                            <span class="text-muted ms-2">(${b.seats.length} Tickets)</span>
                                        </div>
                                    </div>
                                    <div class="col-md-3 text-md-end">
                                        <div class="text-muted small">Amount:</div>
                                        <div class="text-success fw-bold fs-4 mb-3">₹${b.totalAmount.toFixed(2)}</div>
                                        ${!isCancelled ? `
                                            <button class="btn btn-outline-danger btn-sm w-100" onclick="cancelBooking(${b.bookingId})">
                                                <i class="bi bi-x-circle"></i> Cancel Booking
                                            </button>
                                        ` : `
                                            <span class="badge bg-secondary text-muted">Refund Simulated</span>
                                        `}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = `<div class="alert alert-danger">${err.message || 'Error loading bookings.'}</div>`;
            }
        }

        async function cancelBooking(id) {
            if (!confirm("Are you sure you want to cancel this booking? The seats will be released and a simulated refund will be processed.")) {
                return;
            }

            try {
                await apiCall(`/bookings/${id}/cancel`, 'POST', null, true);
                alert("Booking successfully cancelled!");
                await loadMyBookings();
            } catch (err) {
                alert(err.message || "Failed to cancel booking.");
            }
        }
    </script>
</body>
</html>
