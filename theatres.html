const API_BASE_URL = window.location.origin && window.location.origin.startsWith('http')
    ? `${window.location.origin}/api`
    : 'http://localhost:5000/api';

/**
 * Universal Fetch Helper for API Requests with Static Hosting Fallback
 */
async function apiCall(endpoint, method = 'GET', body = null, requiresAuth = false) {
    const headers = { 'Content-Type': 'application/json' };

    if (requiresAuth) {
        const token = localStorage.getItem('token');
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }
    }

    const config = { method, headers };
    if (body) {
        config.body = JSON.stringify(body);
    }

    try {
        const response = await fetch(`${API_BASE_URL}${endpoint}`, config);
        if (response.ok) {
            return await response.json().catch(() => null);
        }
        // If 404 or server error on static host (e.g. GitHub Pages), fallback to mock
        if (response.status === 404 || response.status >= 500) {
            return MockService.handle(endpoint, method, body);
        }
        const data = await response.json().catch(() => null);
        throw new Error(data?.message || 'Something went wrong.');
    } catch (error) {
        // Network error (backend not running or deployed on static host) -> use seamless mock
        console.warn(`[MovieMate API] Backend unreachable at ${endpoint}, serving offline/demo data.`);
        return MockService.handle(endpoint, method, body);
    }
}

    getShows(targetMovieId = null) {
        const todayStr = new Date().toISOString().split('T')[0];
        const showList = [];
        let idCounter = 1;
        const slots = [
            { start: "10:30:00", end: "13:30:00", price: 200 },
            { start: "14:15:00", end: "17:15:00", price: 240 },
            { start: "18:30:00", end: "21:30:00", price: 290 },
            { start: "22:00:00", end: "01:00:00", price: 260 }
        ];

        MockService.theatres.forEach(t => {
            t.screens.forEach((s, sIdx) => {
                slots.forEach((slot, slotIdx) => {
                    const nowShowing = MockService.movies.filter(m => m.status === 'Now Showing');
                    const movie = targetMovieId 
                        ? (MockService.movies.find(m => m.id === targetMovieId) || nowShowing[0])
                        : nowShowing[(sIdx + slotIdx) % nowShowing.length];

                    const sid = idCounter++;
                    showList.push({
                        id: sid,
                        showId: sid,
                        movieId: movie.id,
                        movieTitle: movie.title,
                        screenId: s.id,
                        screenName: s.screenName,
                        theatreId: t.id,
                        theatreName: t.name,
                        theatreCity: t.city,
                        city: t.city,
                        showDate: todayStr,
                        startTime: slot.start,
                        endTime: slot.end,
                        basePrice: slot.price
                    });
                });
            });
        });
        return showList;
    },

    getSeatLayout(showId) {
        const rows = ['A', 'B', 'C', 'D'];
        const seats = [];
        let idCounter = 1;
        const allShows = MockService.getShows();
        const show = allShows.find(s => s.id === parseInt(showId) || s.showId === parseInt(showId)) || allShows[0];
        const basePrice = show.basePrice || 200;

        rows.forEach(r => {
            for (let num = 1; num <= 12; num++) {
                const type = (r === 'A') ? 'Platinum' : (r === 'B' || r === 'C') ? 'Gold' : 'Silver';
                const mult = (r === 'A') ? 1.4 : (r === 'B' || r === 'C') ? 1.2 : 1.0;
                const seatPrice = Math.round(basePrice * mult);
                const currentId = idCounter++;
                seats.push({
                    id: currentId,
                    seatId: currentId,
                    row: r,
                    seatNumber: num,
                    seatCode: `${r}${num}`,
                    seatType: type,
                    priceMultiplier: mult,
                    price: seatPrice
                });
            }
        });
        const booked = [3, 4, 15, 16, 28, 41];
        return {
            show: show,
            seats: seats,
            bookedSeatIds: booked
        };
    },

        handle(endpoint, method = 'GET', body = null) {
        const clean = endpoint.split('?')[0];

        // 0. Coupon Validation
        if (clean === '/coupons/validate' && method === 'POST') {
            const code = ((body && body.code) ? body.code : (body && body.couponCode) ? body.couponCode : '').toUpperCase().trim();
            const sub = Number(body ? body.subTotal : 0) || 0;
            if (code === 'FIRSTBOOK') {
                return { valid: true, code: 'FIRSTBOOK', discountAmount: Math.round(sub * 0.20), message: 'FIRSTBOOK applied: 20% OFF!' };
            }
            if (code === 'MOVIE50') {
                return { valid: true, code: 'MOVIE50', discountAmount: Math.min(50, sub), message: 'MOVIE50 applied: Flat ₹50 OFF!' };
            }
            if (code === 'WEEKEND') {
                return { valid: true, code: 'WEEKEND', discountAmount: Math.round(sub * 0.15), message: 'WEEKEND applied: 15% OFF!' };
            }
            if (code === 'VIP75') {
                return { valid: true, code: 'VIP75', discountAmount: Math.min(75, sub), message: 'VIP75 applied: Flat ₹75 OFF!' };
            }
            if (code === 'FREECOMBO') {
                return { valid: true, code: 'FREECOMBO', discountAmount: Math.min(60, sub), message: 'FREECOMBO applied: Flat ₹60 Snack Discount!' };
            }
            if (code === 'JACKPOT30') {
                return { valid: true, code: 'JACKPOT30', discountAmount: Math.round(sub * 0.30), message: 'JACKPOT30 applied: Mega 30% Discount!' };
            }
            return { valid: false, message: 'Invalid coupon code.' };
        }

        // 1. Genres
        if (clean === '/genres') {
            return [
                { id: 1, name: "Action" },
                { id: 2, name: "Sci-Fi" },
                { id: 3, name: "Drama" },
                { id: 4, name: "Comedy" },
                { id: 5, name: "Thriller" },
                { id: 6, name: "Adventure" },
                { id: 7, name: "Horror" },
                { id: 9, name: "Romance" }
            ];
        }

        // 2. AI Recommendations (Top rated Now Showing)
        if (clean === '/movies/recommended') {
            return MockService.movies
                .filter(m => m.status === 'Now Showing')
                .sort((a, b) => b.rating - a.rating)
                .slice(0, 4);
        }

        // 3. Mood Discovery
        if (clean === '/movies/mood') {
            const queryStr = endpoint.includes('?') ? endpoint.split('?')[1] : '';
            const urlParams = new URLSearchParams(queryStr);
            const mood = (urlParams.get('mood') || '').toLowerCase();
            return MockService.movies.filter(m => {
                const genres = (m.genres || []).map(g => g.name.toLowerCase());
                if (mood.includes('action')) return genres.includes('action');
                if (mood.includes('comedy')) return genres.includes('comedy');
                if (mood.includes('horror') || mood.includes('thrill')) return genres.includes('horror') || genres.includes('thriller');
                if (mood.includes('sci-fi') || mood.includes('future')) return genres.includes('sci-fi');
                if (mood.includes('drama') || mood.includes('emotion')) return genres.includes('drama');
                if (mood.includes('romance')) return genres.includes('romance');
                return true;
            });
        }

        // 4. Typeahead Search
        if (clean === '/movies/suggestions') {
            const queryStr = endpoint.includes('?') ? endpoint.split('?')[1] : '';
            const urlParams = new URLSearchParams(queryStr);
            const q = (urlParams.get('q') || '').toLowerCase();
            if (!q) return [];
            return MockService.movies
                .filter(m => m.title.toLowerCase().includes(q))
                .slice(0, 5)
                .map(m => ({
                    id: m.id,
                    title: m.title,
                    subtitle: `${m.language} • ${m.status}`,
                    type: 'Movie',
                    url: `movie-details.html?id=${m.id}`
                }));
        }

        // 5. Watchlist
        if (clean === '/watchlist' || clean.startsWith('/watchlist/')) {
            let stored = [];
            try { stored = JSON.parse(localStorage.getItem('moviemate_watchlist') || '[]'); } catch(e) {}
            if (clean.startsWith('/watchlist/check/')) {
                const checkId = parseInt(clean.replace('/watchlist/check/', ''));
                return stored.includes(checkId);
            }
            if (method === 'POST') {
                const addId = parseInt(clean.replace('/watchlist/', ''));
                if (!isNaN(addId)) {
                    const idx = stored.indexOf(addId);
                    let inWatchlist = false;
                    if (idx === -1) {
                        stored.push(addId);
                        inWatchlist = true;
                    } else {
                        stored.splice(idx, 1);
                        inWatchlist = false;
                    }
                    localStorage.setItem('moviemate_watchlist', JSON.stringify(stored));
                    return { inWatchlist: inWatchlist, message: inWatchlist ? 'Added to watchlist' : 'Removed from watchlist' };
                }
                return { inWatchlist: false };
            }
            if (method === 'DELETE') {
                const delId = parseInt(clean.replace('/watchlist/', ''));
                stored = stored.filter(id => id !== delId);
                localStorage.setItem('moviemate_watchlist', JSON.stringify(stored));
                return { success: true };
            }
            return MockService.movies.filter(m => stored.includes(m.id));
        }

        // 6. Reviews
        if (clean.includes('/reviews')) {
            if (method === 'POST') {
                return { success: true, message: 'Review submitted successfully!' };
            }
            return [
                { id: 1, userName: "Aarav Sharma", rating: 5, reviewText: "Mindblowing cinematic visual experience! Worth every penny.", createdAt: new Date().toISOString() },
                { id: 2, userName: "Sneha Patil", rating: 4, reviewText: "Superb storytelling and brilliant background score. Must watch with family!", createdAt: new Date().toISOString() }
            ];
        }

        // 7. Movies catalog endpoints
        if (clean === '/movies' || clean === '/movies/featured') {
            const queryStr = endpoint.includes('?') ? endpoint.split('?')[1] : '';
            if (!queryStr) return MockService.movies;
            const params = new URLSearchParams(queryStr);
            const search = (params.get('search') || '').toLowerCase();
            const genreId = params.get('genreId');
            const status = (params.get('status') || '').toLowerCase();

            return MockService.movies.filter(m => {
                if (search && !m.title.toLowerCase().includes(search) && !(m.cast && m.cast.toLowerCase().includes(search))) return false;
                if (genreId && !(m.genres && m.genres.some(g => String(g.id) === String(genreId)))) return false;
                if (status && m.status.toLowerCase() !== status) return false;
                return true;
            });
        }
        if (clean.startsWith('/movies/')) {
            const id = parseInt(clean.replace('/movies/', ''));
            if (!isNaN(id)) {
                const m = MockService.movies.find(x => x.id === id) || MockService.movies[0];
                const shows = MockService.getShows(m.id);
                return {
                    ...m,
                    shows: shows,
                    availableShows: shows
                };
            }
        }

        // 8. Theatres endpoints
        if (clean === '/theatres') {
            return MockService.theatres;
        }

        // 9. Shows endpoints & Live Seat Layout
        if (clean.includes('/live-status')) {
            const parts = clean.split('/');
            const showId = parseInt(parts[2]) || 1;
            const layout = MockService.getSeatLayout(showId);
            const seats = layout.seats.map(st => ({
                ...st,

            }));

                partnerName: "PVR-INOX Vista Cinema POS Gateway v4.2",
                status: "Connected (Live)",
                latencyMs: 14,
                priceTag: "Standard",
                dynamicBasePrice: layout.show.basePrice,
                basePrice: layout.show.basePrice,
                totalSeats: 48,
                bookedSeats: layout.bookedSeatIds.length,
                occupancyPercentage: Math.round((layout.bookedSeatIds.length / 48) * 100),
                occupancyStatus: "Available",
                seats: seats,
                seatLayout: layout,
                show: layout.show
            };
        }
        if (clean.includes('/seat-layout')) {
            const showId = clean.split('/')[2];
            return MockService.getSeatLayout(showId);
        }
        if (clean.startsWith('/shows/')) {
            const showId = parseInt(clean.replace('/shows/', ''));
            if (!isNaN(showId)) {
                const allShows = MockService.getShows();
                return allShows.find(s => s.id === showId || s.showId === showId) || allShows[0];
            }
        }
        if (clean === '/shows') {
            return MockService.getShows();
        }

        // 10. Auth
        if (clean === '/auth/login' || clean === '/auth/register') {
            const email = body?.email || 'user@movieticket.com';
            const role = email.includes('admin') ? 'Admin' : 'User';
            const name = (body?.fullName && body.fullName.trim() !== '' && body.fullName !== 'undefined') ? body.fullName.trim() : (role === 'Admin' ? 'System Administrator' : extractNameFromEmail(email));
            return {
                token: 'mock-jwt-token-preview',
                email: email,
                fullName: name,
                role: role
            };
        }

        // 11. Admin Dashboard & Bookings
        if (clean === '/admin/dashboard') {
            return {
                totalRevenue: 52400.00,
                totalBookings: 184,
                totalMovies: MockService.movies.length,
                totalUsers: 142,
                recentBookings: [
                    { bookingNumber: "MM-984321", customerName: "Rahul Sharma", movieTitle: "Stree 2: Sarkate Ka Aatank", seats: ["A4", "A5"], totalAmount: 640.00, status: "Confirmed" },
                    { bookingNumber: "MM-984320", customerName: "Pooja Patil", movieTitle: "Kalki 2898 AD", seats: ["B6", "B7"], totalAmount: 580.00, status: "Confirmed" },
                    { bookingNumber: "MM-984319", customerName: "Amit Joshi", movieTitle: "Deadpool & Wolverine", seats: ["C10"], totalAmount: 290.00, status: "Confirmed" }
                ],
                topMovies: [
                    { title: "Stree 2: Sarkate Ka Aatank", bookingsCount: 68 },
                    { title: "Kalki 2898 AD", bookingsCount: 52 },
                    { title: "Pushpa 2: The Rule", bookingsCount: 41 }
                ],
                popularMovies: [
                    { movieTitle: "Stree 2: Sarkate Ka Aatank", bookingsCount: 68, totalSales: 16320 },
                    { movieTitle: "Kalki 2898 AD", bookingsCount: 52, totalSales: 12480 },
                    { movieTitle: "Pushpa 2: The Rule", bookingsCount: 41, totalSales: 9840 }
                ]
            };
        }

        if (clean === '/admin/bookings' || clean.includes('/bookings/my')) {
            let myBookings = [];
            try {
                const stored = JSON.parse(localStorage.getItem('moviemate_last_booking') || 'null');
                if (stored) myBookings.push(stored);
            } catch(e) {}
            if (myBookings.length === 0) {
                myBookings = [
                    { bookingNumber: "MM-984321", customerName: "Rahul Sharma", customerEmail: "user@movieticket.com", movieTitle: "Stree 2: Sarkate Ka Aatank", theatreName: "INOX - Khandesh Central Mall", screenName: "Laser 4K", showDate: new Date().toISOString(), startTime: "18:30:00", seats: ["A4", "A5"], totalAmount: 640.00, paymentMethod: "UPI", status: "Confirmed" }
                ];
            }
            return myBookings;
        }

        // 12. Create Booking
        if (clean === '/bookings' && method === 'POST') {
            const bookingNum = "MM-" + Math.floor(100000 + Math.random() * 900000);
            const newBooking = {
                id: Math.floor(Math.random() * 10000),
                bookingNumber: bookingNum,
                customerName: body?.customerName || localStorage.getItem('fullName') || 'Valued Customer',
                customerEmail: body?.customerEmail || localStorage.getItem('email') || 'user@movieticket.com',

                seats: body?.seats || ['A1'],
                totalAmount: body?.totalAmount || 500,
                paymentMethod: body?.paymentMethod || 'UPI',

                message: "Booking confirmed successfully!"
            };
            try {
                localStorage.setItem('moviemate_last_booking', JSON.stringify(newBooking));
            } catch(e) {}
            return newBooking;
        }

        // Default empty fallback
        return [];
    }

/**
 * Derives a human-friendly full name from an email address (e.g. bhavsarmohit53@gmail.com -> Bhavsar Mohit)
 */
function extractNameFromEmail(email) {
    if (!email || typeof email !== 'string') return 'User';
    var raw = email.split('@')[0];
    if (!raw) return 'User';
    raw = raw.replace(/[._\-+]+/g, ' ');
    var rawWords = raw.split(/\s+/);
    var words = [];
    for (var i = 0; i < rawWords.length; i++) {
        var w = rawWords[i].replace(/\d+/g, '').replace(/^\s+|\s+$/g, '');
        if (w) words.push(w);
    }
    if (words.length === 1) {
        var str = words[0].toLowerCase();
        var nameTokens = [
            'bhavsar', 'mohit', 'rahul', 'sharma', 'patil', 'joshi', 'kumar', 'singh',
            'gupta', 'verma', 'shah', 'mehta', 'khan', 'kapoor', 'reddy', 'roy',
            'das', 'nair', 'rao', 'patel', 'yadav', 'mishra', 'shukla', 'aarav',
            'sneha', 'pooja', 'amit', 'priya', 'ankit', 'sumit', 'vikas', 'sachin',
            'aman', 'deepak', 'neha', 'kunal', 'varun', 'aditya', 'ayush', 'gaurav',
            'manish', 'raj', 'rohan', 'vikram', 'ajay', 'vijay', 'sanjay', 'anil',
            'sunil', 'ashok', 'alok', 'anand', 'saheb', 'kiran', 'swati', 'rohit'
        ];
        for (var j = 0; j < nameTokens.length; j++) {
            var token = nameTokens[j];
            if (str.indexOf(token) === 0 && str.length > token.length) {
                var remainder = str.substring(token.length);
                words = [token, remainder];
                break;
            } else if (str.length > token.length && str.indexOf(token) === str.length - token.length) {
                var prefix = str.substring(0, str.length - token.length);
                words = [prefix, token];
                break;
            }
        }
    }
    var formattedArr = [];
    for (var k = 0; k < words.length; k++) {
        var wd = words[k];
        formattedArr.push(wd.charAt(0).toUpperCase() + wd.substring(1).toLowerCase());
    }
    var res = formattedArr.join(' ');
    return res || 'User';
}
var Auth = window.Auth = {
    saveSession(token, email, fullName, role) {
        localStorage.setItem('token', token || 'mock_jwt_token_12345');
        if (email && email !== 'undefined' && email !== 'null' && String(email).trim() !== '') {
            localStorage.setItem('email', email);
        } else {
            localStorage.removeItem('email');
        }
        if (fullName && fullName !== 'undefined' && fullName !== 'null' && String(fullName).trim() !== '') {
            localStorage.setItem('fullName', fullName);
        } else {
            localStorage.removeItem('fullName');
        }
        if (role && role !== 'undefined' && role !== 'null' && String(role).trim() !== '') {
            localStorage.setItem('role', role);
        } else {
            localStorage.removeItem('role');
        }
    },

    clearSession() {
        localStorage.removeItem('token');
        localStorage.removeItem('email');
        localStorage.removeItem('fullName');
        localStorage.removeItem('role');
    },

    isLoggedIn() {
        return !!localStorage.getItem('token');
    },

    isAdmin() {
        return localStorage.getItem('role') === 'Admin';
    },

    getUser() {
        let fn = localStorage.getItem('fullName');
        if (!fn || fn === 'undefined' || fn === 'null' || fn.trim() === '') fn = null;

        let em = localStorage.getItem('email');
        if (!em || em === 'undefined' || em === 'null' || em.trim() === '') em = null;

        // Auto-fix: if old dummy 'Rahul Sharma' was stored for another user's email, replace with real derived name
        if (em && fn === 'Rahul Sharma' && !em.toLowerCase().includes('rahul')) {
            fn = extractNameFromEmail(em);
            localStorage.setItem('fullName', fn);
        }

        // If fullName is missing but email is present, derive from email
        if (!fn && em) {
            fn = extractNameFromEmail(em);
            localStorage.setItem('fullName', fn);
        }

        return {
            token: localStorage.getItem('token'),
            email: em,
            fullName: fn,
            role: localStorage.getItem('role') || (em && em.includes('admin') ? 'Admin' : 'User')
        };
    },

    getCity() {
        return localStorage.getItem('selectedCity') || 'Jalgaon';
    },

    setCity(city) {
        localStorage.setItem('selectedCity', city);
        window.location.reload();
    },

    logout() {
        Auth.clearSession();
        window.location.href = 'index.html';

};
