<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theatres - MovieMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-film"></i> MovieMate</a>
            <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="movies.html">Movies</a></li>
                    <li class="nav-item"><a class="nav-link active" href="theatres.html">Theatres</a></li>
                </ul>
                <ul class="navbar-nav align-items-center" id="navAuthSection"></ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h2 class="fw-bold text-light mb-1"><i class="bi bi-buildings text-danger"></i> Partner Theatres &amp; Multiplexes</h2>
                <p class="text-muted small mb-0">Browse certified multiplexes and luxury screens across cities</p>
            </div>
            <div class="d-flex gap-2" id="theatreCityFilters">
                <button class="btn btn-sm btn-cinema active" onclick="filterTheatres('All', this)">All Cities</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="filterTheatres('Jalgaon', this)"><i class="bi bi-geo-alt-fill text-danger"></i> Jalgaon</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="filterTheatres('Mumbai', this)">Mumbai</button>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 g-4" id="theatresContainer">
            <div class="col-12 text-center text-muted py-5">
                <div class="spinner-border text-danger"></div>
                <p class="mt-2">Loading theatres...</p>
            </div>
        </div>
    </div>

    <footer class="text-center">
        <div class="container">
            <p class="mb-1 text-light fw-bold"><i class="bi bi-film text-danger"></i> MovieMate - Movie Ticket Booking System</p>
            <p class="small mb-0">Final Year Academic Project | ASP.NET Core &amp; SQL Server &amp; Bootstrap 5</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let allTheatres = [];

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                allTheatres = await apiCall('/theatres');
                const userCity = Auth.getCity();
                if (userCity && userCity.toLowerCase() === 'jalgaon') {
                    const jalgaonBtn = document.querySelector('#theatreCityFilters button:nth-child(2)');
                    if (jalgaonBtn) filterTheatres('Jalgaon', jalgaonBtn);
                } else {
                    renderTheatres(allTheatres);
                }
            } catch (err) {
                document.getElementById('theatresContainer').innerHTML = `<div class="col-12 text-danger text-center">${err.message}</div>`;
            }
        });

        function renderTheatres(theatres) {
            const container = document.getElementById('theatresContainer');
            if (!theatres || theatres.length === 0) {
                container.innerHTML = `<div class="col-12 text-center text-muted py-5"><i class="bi bi-building-x fs-1"></i><p class="mt-2">No theatres found in this city.</p></div>`;
                return;
            }

            container.innerHTML = theatres.map(t => `
                <div class="col">
                    <div class="card bg-dark border-secondary h-100 rounded-4 shadow p-4">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h4 class="fw-bold text-light mb-0"><i class="bi bi-geo-alt-fill text-danger"></i> ${t.name}</h4>
                            <span class="badge ${t.city.toLowerCase() === 'jalgaon' ? 'bg-danger' : 'bg-secondary'}">${t.city}</span>
                        </div>
                        <p class="text-muted small mb-3">${t.address}</p>

                        <div class="mb-3">
                            <div class="text-light small fw-bold mb-2">Available Screens:</div>
                            <div class="d-flex flex-wrap gap-2">
                                ${t.screens.map(s => `
                                    <span class="badge bg-black border border-secondary text-light p-2">
                                        <i class="bi bi-display"></i> ${s.screenName} (${s.totalSeats} Seats)
                                    </span>
                                `).join('')}
                            </div>
                        </div>

                        <div class="mt-auto pt-3 border-top border-secondary">
                            <a href="movies.html" class="btn btn-cinema-outline btn-sm w-100">
                                <i class="bi bi-film"></i> Browse Movies at this Cinema
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterTheatres(city, btn) {
            document.querySelectorAll('#theatreCityFilters button').forEach(b => {
                b.classList.remove('btn-cinema', 'active');
                b.classList.add('btn-outline-secondary');
            });
            btn.classList.remove('btn-outline-secondary');
            btn.classList.add('btn-cinema', 'active');

            if (city === 'All') {
                renderTheatres(allTheatres);
            } else {
                renderTheatres(allTheatres.filter(t => t.city.toLowerCase() === city.toLowerCase()));
            }
        }
    </script>
</body>
</html>
