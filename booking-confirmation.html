<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed - MovieMate E-Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
:root {
    --primary-color: #e50914;
    --primary-hover: #b80710;
    --dark-bg: #0b0f19;
    --card-bg: #151c2e;
    --card-border: #232d42;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-gold: #f59e0b;
    --seat-available: #334155;
    --seat-selected: #10b981;
    --seat-booked: #ef4444;
}

body {
    background-color: var(--dark-bg);
    color: var(--text-main);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
    width: 8px;
}
::-webkit-scrollbar-track {
    background: #0f172a;
}
::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 4px;
}

/* Navbar */
.navbar-custom {
    background-color: rgba(11, 15, 25, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--card-border);
    padding: 0.8rem 0;
}

.navbar-brand {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary-color) !important;
    letter-spacing: 0.5px;
}

.nav-link {
    color: #cbd5e1 !important;
    font-weight: 500;
    margin: 0 0.3rem;
    transition: color 0.2s;
}

.nav-link:hover, .nav-link.active {
    color: var(--primary-color) !important;
}

/* Hero Section with Avengers Cinematic Theme */
.hero-banner {
    position: relative;
    background: linear-gradient(180deg, rgba(11, 15, 25, 0.72) 0%, rgba(11, 15, 25, 0.88) 65%, var(--dark-bg) 100%),
                url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1600&q=80') no-repeat center center / cover;
    padding: 6.5rem 0 4.5rem 0;
    border-bottom: 1px solid var(--card-border);
    box-shadow: inset 0 -35px 50px rgba(11, 15, 25, 0.95);
    overflow: hidden;
}

.hero-banner h1 {
    text-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
    letter-spacing: -0.5px;
}

.hero-banner p {
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
}

.hero-avengers-badge {
    background: linear-gradient(90deg, #e50914, #7c3aed);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
}

/* Movie Cards */
.movie-card {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.movie-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(229, 9, 20, 0.2);
    border-color: #3b4866;
}

.movie-poster {
    height: 340px;
    object-fit: cover;
    width: 100%;
    background-color: #1e293b;
}

.movie-card .card-body {
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.movie-card .badge-rating {
    background-color: rgba(245, 158, 11, 0.15);
    color: var(--accent-gold);
    border: 1px solid rgba(245, 158, 11, 0.3);
    font-weight: 600;
}

.badge-genre {
    background-color: #1e293b;
    color: #94a3b8;
    font-size: 0.75rem;
    margin-right: 0.3rem;
    margin-bottom: 0.3rem;
    display: inline-block;
}

/* Buttons */
.btn-cinema {
    background-color: var(--primary-color);
    color: #fff;
    border: none;
    font-weight: 600;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    transition: background-color 0.2s, transform 0.1s;
}

.btn-cinema:hover {
    background-color: var(--primary-hover);
    color: #fff;
}

.btn-cinema-outline {
    background: transparent;
    color: var(--text-main);
    border: 1px solid var(--card-border);
    font-weight: 500;
    border-radius: 8px;
}

.btn-cinema-outline:hover {
    background: #1e293b;
    color: #fff;
    border-color: #475569;
}

/* Seat Selection Grid */
.screen-indicator {
    width: 80%;
    height: 8px;
    background: linear-gradient(90deg, transparent, #38bdf8, transparent);
    margin: 2rem auto 0.5rem auto;
    border-radius: 50%;
    box-shadow: 0 4px 15px rgba(56, 189, 248, 0.5);
}

.seat {
    width: 34px;
    height: 32px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease, background-color 0.15s;
    margin: 4px;
}

.seat.available {
    background-color: var(--seat-available);
    color: #cbd5e1;
    border: 1px solid #475569;
}

.seat.available:hover {
    background-color: #475569;
    transform: scale(1.1);
}

.seat.selected {
    background-color: var(--seat-selected) !important;
    color: #fff !important;
    border: 1px solid #059669 !important;
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
}

.seat.booked {
    background-color: #241416 !important;
    color: #64748b !important;
    border: 1px solid #451a1e !important;
    cursor: not-allowed;
    opacity: 0.6;
}

/* Footer */
footer {
    margin-top: auto;
    background-color: #080c14;
    border-top: 1px solid var(--card-border);
    padding: 2rem 0;
    color: var(--text-muted);
}

/* Cinema Live Sync Keyframes */
@keyframes spinSync {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.spin-animation {
    animation: spinSync 0.8s linear infinite;
    display: inline-block;
}

.live-pulse-badge {
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
}

</style>
    <style>
        @media print {
            body { background: #fff !important; color: #000 !important; }
            .no-print { display: none !important; }
            .ticket-card { border: 2px dashed #000 !important; background: #fff !important; color: #000 !important; box-shadow: none !important; }
            .text-light { color: #000 !important; }
            .text-muted { color: #555 !important; }
            .bg-black { background: #eee !important; color: #000 !important; }
        }
        .ticket-card {
            background-color: var(--card-bg);
            border: 2px dashed var(--card-border);
            border-radius: 20px;
        }
        .qr-wrapper {
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            display: inline-block;
        }
    </style>
</head>
<body data-bs-theme="dark">
    <nav class="navbar navbar-expand-lg navbar-custom no-print">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-film"></i> MovieMate</a>
            <a href="index.html" class="btn btn-sm btn-cinema-outline"><i class="bi bi-house"></i> Back to Home</a>
        </div>
    </nav>

    <div class="container my-5" style="max-width: 800px;">
        <!-- Success Banner -->
        <div class="text-center mb-4 no-print">
            <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-25 text-success rounded-circle mb-3" style="width: 70px; height: 70px;">
                <i class="bi bi-check-lg fs-1"></i>
            </div>
            <h2 class="fw-bold text-light">Booking Confirmed!</h2>
            <p class="text-muted">Your tickets are locked and payment was successfully simulated.</p>
        </div>

        <!-- E-Ticket Card -->
        <div class="ticket-card p-4 shadow-lg mb-4" id="ticketContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-danger"></div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex justify-content-center gap-3 no-print">
            <button class="btn btn-cinema-outline" onclick="window.print()">
                <i class="bi bi-printer"></i> Print / Save as PDF
            </button>
            <a href="my-bookings.html" class="btn btn-cinema">
                <i class="bi bi-ticket-perforated"></i> View in My Bookings
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const raw = sessionStorage.getItem('confirmedBooking');
            if (!raw) {
                alert("No confirmation data found.");
                window.location.href = 'index.html';
                return;
            }

            const b = JSON.parse(raw);
            const dateStr = new Date(b.showDate).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
            const timeStr = b.startTime.substring(0, 5);

            // UNIQUE FEATURE: Real QR Code generation for ticket verification
            const qrData = encodeURIComponent(`MOVIEMATE E-TICKET VERIFIED\nRef: ${b.bookingNumber}\nMovie: ${b.movieTitle}\nTheatre: ${b.theatreName}\nScreen: ${b.screenName}\nSeats: ${b.seats.join(', ')}\nDate: ${dateStr} ${timeStr}\nCustomer: ${b.customerName}\nStatus: ${b.status}`);
            const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${qrData}`;

            document.getElementById('ticketContainer').innerHTML = `
                <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-3 mb-3">
                    <div>
                        <div class="navbar-brand text-danger fw-bold fs-4 mb-0"><i class="bi bi-film"></i> MovieMate E-Ticket</div>
                        <span class="text-muted small">Booking Reference: <strong class="text-light">${b.bookingNumber}</strong></span>
                    </div>
                    <span class="badge bg-success fs-6"><i class="bi bi-check-circle"></i> ${b.status}</span>
                </div>

                <div class="row g-4 align-items-center">
                    <div class="col-md-3 text-center">
                        <img src="${b.posterUrl}" class="rounded-3 shadow w-100" style="max-height: 220px; object-fit: cover;" alt="${b.movieTitle}" onerror="this.src='images/default_poster.svg'">
                    </div>
                    <div class="col-md-6">
                        <h3 class="fw-bold text-light mb-1">${b.movieTitle}</h3>
                        <p class="text-danger fw-bold mb-1"><i class="bi bi-geo-alt"></i> ${b.theatreName}</p>
                        <div class="text-muted small mb-3">${b.theatreAddress}</div>

                        <div class="row g-2 my-2 text-light small">
                            <div class="col-6"><strong>Auditorium:</strong> ${b.screenName}</div>
                            <div class="col-6"><strong>Date:</strong> ${dateStr}</div>
                            <div class="col-6"><strong>Showtime:</strong> ${timeStr}</div>
                            <div class="col-6"><strong>Tickets:</strong> ${b.seats.length} Person(s)</div>
                        </div>

                        <div class="p-2 px-3 rounded bg-black border border-secondary text-light mt-3">
                            <span class="text-muted small">Confirmed Seats:</span>
                            <span class="text-warning fw-bold fs-5 ms-2">${b.seats.join(', ')}</span>
                        </div>
                    </div>

                    <!-- UNIQUE FEATURE: Scannable QR Code -->
                    <div class="col-md-3 text-center border-start border-secondary">
                        <div class="qr-wrapper shadow-sm mb-2">
                            <img src="${qrCodeUrl}" alt="Scannable Ticket QR" class="img-fluid" style="width: 130px; height: 130px;">
                        </div>
                        <div class="small text-muted" style="font-size: 0.75rem;">
                            <i class="bi bi-qr-code-scan text-warning"></i> Scan with Phone to Verify Ticket
                        </div>
                    </div>
                </div>

                <hr class="border-secondary my-3">

                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 text-muted small">
                    <div>
                        <div><strong>Ticket Holder:</strong> ${b.customerName} (${b.customerEmail})</div>
                        <div><strong>Transaction ID:</strong> ${b.transactionId} (${b.paymentMethod})</div>
                    </div>
                    <div class="text-end">
                        <div class="text-muted">Total Amount Paid:</div>
                        <div class="text-success fw-bold fs-4">₹${b.totalAmount.toFixed(2)}</div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
