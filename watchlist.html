<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Watchlist - MovieMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-film"></i> MovieMate</a>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="movies.html">Movies</a></li>
                    <li class="nav-item"><a class="nav-link" href="theatres.html">Theatres</a></li>
                </ul>
                <ul class="navbar-nav align-items-center" id="navAuthSection"></ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-light mb-0"><i class="bi bi-bookmark-heart text-danger"></i> My Watchlist</h2>
            <span class="text-muted small" id="watchlistCount">0 Movies Saved</span>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="watchlistContainer">
            <div class="col-12 text-center text-muted py-5">
                <div class="spinner-border text-danger"></div>
                <p class="mt-2">Loading your watchlist...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.isLoggedIn()) {
                alert("Please login to view your watchlist.");
                window.location.href = 'login.html';
                return;
            }

            await loadWatchlist();
        });

        async function loadWatchlist() {
            const container = document.getElementById('watchlistContainer');
            try {
                const movies = await apiCall('/watchlist', 'GET', null, true);
                document.getElementById('watchlistCount').innerText = `${movies.length} Movie(s) Saved`;

                if (!movies || movies.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center text-muted py-5">
                            <i class="bi bi-bookmark-x fs-1"></i>
                            <h4 class="mt-3">Your Watchlist is Empty</h4>
                            <p>Browse our catalog and save movies to watch later.</p>
                            <a href="movies.html" class="btn btn-cinema">Explore Movies</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = movies.map(m => `
                    <div class="col">
                        <div class="movie-card">
                            <img src="${m.posterUrl}" class="movie-poster" alt="${m.title}" onerror="this.src='images/default_poster.svg'">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="badge badge-rating"><i class="bi bi-star-fill"></i> ${m.rating > 0 ? m.rating.toFixed(1) : 'NR'}</span>
                                    <span class="text-muted small">${m.language}</span>
                                </div>
                                <h5 class="card-title text-truncate fw-bold mb-1">${m.title}</h5>
                                <div class="mb-3">
                                    ${m.genres.map(g => `<span class="badge badge-genre">${g.name}</span>`).join('')}
                                </div>
                                <div class="mt-auto d-flex gap-2">
                                    <a href="movie-details.html?id=${m.id}" class="btn btn-cinema flex-grow-1 btn-sm">
                                        <i class="bi bi-ticket-perforated"></i> View
                                    </a>
                                    <button class="btn btn-outline-danger btn-sm" onclick="removeFromWatchlist(${m.id})">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<div class="col-12 text-danger text-center">${err.message}</div>`;
            }
        }

        async function removeFromWatchlist(movieId) {
            try {
                await apiCall(`/watchlist/${movieId}`, 'POST', null, true);
                await loadWatchlist();
            } catch (err) {
                alert(err.message);
            }
        }
    </script>
</body>
</html>
