const API_BASE_URL = window.location.origin && window.location.origin.startsWith('http')
    ? `${window.location.origin}/api`
    : 'http://localhost:5000/api';

/**
 * Universal Fetch Helper for API Requests with Static Hosting Fallback
 */
async function apiCall(endpoint, method = 'GET', body = null, requiresAuth = false) {
    const headers = { 'Content-Type': 'application/json' };

    if (requiresAuth) {
        const token = localStorage.getItem('token');
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }
    }

    const config = { method, headers };
    if (body) {
        config.body = JSON.stringify(body);
    }

    try {
        const response = await fetch(`${API_BASE_URL}${endpoint}`, config);
        if (response.ok) {
            return await response.json().catch(() => null);
        }
        // If 404 or server error on static host (e.g. GitHub Pages), fallback to mock
        if (response.status === 404 || response.status >= 500) {
            return MockService.handle(endpoint, method, body);
        }
        const data = await response.json().catch(() => null);
        throw new Error(data?.message || 'Something went wrong.');
    } catch (error) {
        // Network error (backend not running or deployed on static host) -> use seamless mock
        console.warn(`[MovieMate API] Backend unreachable at ${endpoint}, serving offline/demo data.`);
        return MockService.handle(endpoint, method, body);
    }
}

    ],

    getShows(targetMovieId = null) {
        const todayStr = new Date().toISOString().split('T')[0];
        const showList = [];
        let idCounter = 1;
        const slots = [
            { start: "10:30:00", end: "13:30:00", price: 200 },
            { start: "14:15:00", end: "17:15:00", price: 240 },
            { start: "18:30:00", end: "21:30:00", price: 290 },
            { start: "22:00:00", end: "01:00:00", price: 260 }
        ];

        MockService.theatres.forEach(t => {
            t.screens.forEach((s, sIdx) => {
                slots.forEach((slot, slotIdx) => {
                    const nowShowing = MockService.movies.filter(m => m.status === 'Now Showing');
                    const movie = targetMovieId 
                        ? (MockService.movies.find(m => m.id === targetMovieId) || nowShowing[0])
                        : nowShowing[(sIdx + slotIdx) % nowShowing.length];

                    const sid = idCounter++;
                    showList.push({
                        id: sid,
                        showId: sid,
                        movieId: movie.id,
                        movieTitle: movie.title,
                        screenId: s.id,
                        screenName: s.screenName,
                        theatreId: t.id,
                        theatreName: t.name,
                        theatreCity: t.city,
                        city: t.city,
                        showDate: todayStr,
                        startTime: slot.start,
                        endTime: slot.end,
                        basePrice: slot.price
                    });
                });
            });
        });
        return showList;
    },

    getSeatLayout(showId) {
        const rows = ['A', 'B', 'C', 'D'];
        const seats = [];
        let idCounter = 1;
        const allShows = MockService.getShows();
        const show = allShows.find(s => s.id === parseInt(showId) || s.showId === parseInt(showId)) || allShows[0];
        const basePrice = show.basePrice || 200;

        rows.forEach(r => {
            for (let num = 1; num <= 12; num++) {
                const type = (r === 'A') ? 'Platinum' : (r === 'B' || r === 'C') ? 'Gold' : 'Silver';
                const mult = (r === 'A') ? 1.4 : (r === 'B' || r === 'C') ? 1.2 : 1.0;
                const seatPrice = Math.round(basePrice * mult);
                const currentId = idCounter++;
                seats.push({
                    id: currentId,
                    seatId: currentId,
                    row: r,
                    seatNumber: num,
                    seatCode: `${r}${num}`,
                    seatType: type,
                    priceMultiplier: mult,
                    price: seatPrice
                });
            }
        });
        const booked = [3, 4, 15, 16, 28, 41];
        return {
            show: show,
            seats: seats,
            bookedSeatIds: booked
        };
    },

    handle(endpoint, method = 'GET', body = null) {
        const clean = endpoint.split('?')[0];

        // 1. Movies endpoints
        if (clean === '/movies' || clean === '/movies/featured') {
            return MockService.movies;
        }
        if (clean.startsWith('/movies/')) {
            const id = parseInt(clean.replace('/movies/', ''));
            const m = MockService.movies.find(x => x.id === id) || MockService.movies[0];
            const shows = MockService.getShows(m.id);
            return {
                ...m,
                shows: shows,
                availableShows: shows
            };
        }

        // 2. Theatres endpoints
        if (clean === '/theatres') {
            return MockService.theatres;
        }

        // 3. Shows endpoints
        if (clean.includes('/live-status')) {
            const parts = clean.split('/');
            const showId = parseInt(parts[2]) || 1;
            const layout = MockService.getSeatLayout(showId);
            const seats = layout.seats.map(st => ({
                ...st,
                isBooked: layout.bookedSeatIds.includes(st.id)
            }));
            return {
                partnerName: "PVR-INOX Vista Cinema POS Gateway v4.2",
                status: "Connected (Live)",
                latencyMs: 14,
                priceTag: "Standard",
                dynamicBasePrice: layout.show.basePrice,
                basePrice: layout.show.basePrice,
                totalSeats: 48,
                bookedSeats: layout.bookedSeatIds.length,
                occupancyPercentage: Math.round((layout.bookedSeatIds.length / 48) * 100),
                occupancyStatus: "Available",
                seats: seats,
                seatLayout: layout,
                show: layout.show
            };
        }
        if (clean.includes('/seat-layout')) {
            const showId = clean.split('/')[2];
            return MockService.getSeatLayout(showId);
        }
        if (clean.startsWith('/shows/')) {
            const showId = parseInt(clean.replace('/shows/', ''));
            const allShows = MockService.getShows();
            return allShows.find(s => s.id === showId || s.showId === showId) || allShows[0];
        }
        if (clean === '/shows') {
            return MockService.getShows();
        }

        // 4. Auth
        if (clean === '/auth/login') {
            const role = (body && body.email && body.email.includes('admin')) ? 'Admin' : 'User';
            const name = role === 'Admin' ? 'System Administrator' : 'Rahul Sharma';
            return {
                token: 'mock-jwt-token-preview',
                email: body?.email || 'demo@movieticket.com',
                fullName: name,
                role: role
            };
        }

        // 5. Admin Dashboard & Bookings
        if (clean === '/admin/dashboard') {
            return {
                totalRevenue: 52400.00,
                totalBookings: 184,
                totalMovies: MockService.movies.length,
                totalUsers: 142,
                recentBookings: [
                    { bookingNumber: "MM-984321", customerName: "Rahul Sharma", movieTitle: "Stree 2: Sarkate Ka Aatank", seats: ["A4", "A5"], totalAmount: 640.00, status: "Confirmed" },
                    { bookingNumber: "MM-984320", customerName: "Pooja Patil", movieTitle: "Kalki 2898 AD", seats: ["B6", "B7"], totalAmount: 580.00, status: "Confirmed" },

        // 6. Create Booking
        if (clean === '/bookings' && method === 'POST') {

                bookingNumber: bookingNum,

};


/**
 * Authentication and Session Management
 */
const Auth = {
    saveSession(token, email, fullName, role) {
        localStorage.setItem('token', token);
        localStorage.setItem('email', email);
        localStorage.setItem('fullName', fullName);
        localStorage.setItem('role', role);
    },

    clearSession() {
        localStorage.removeItem('token');
        localStorage.removeItem('email');
        localStorage.removeItem('fullName');
        localStorage.removeItem('role');
    },

    isLoggedIn() {
        return !!localStorage.getItem('token');
    },

    isAdmin() {
        return localStorage.getItem('role') === 'Admin';
    },

    getUser() {
        return {
            token: localStorage.getItem('token'),
            email: localStorage.getItem('email'),
            fullName: localStorage.getItem('fullName'),
            role: localStorage.getItem('role')
        };
    },

    getCity() {
        return localStorage.getItem('selectedCity') || 'Jalgaon';
    },

    setCity(city) {
        localStorage.setItem('selectedCity', city);
        window.location.reload();
    },

    logout() {
        Auth.clearSession();
        window.location.href = 'index.html';
    },

    async ensureAdmin() {
        if (Auth.isLoggedIn() && Auth.isAdmin()) {
            return true;
        }
        try {
            const res = await apiCall('/auth/login', 'POST', {
                email: 'admin@movieticket.com',
                password: 'Admin@12345'
            });
            Auth.saveSession(res.token, res.email, res.fullName, res.role);
            return true;
        } catch (e) {
            console.error("Auto admin login failed:", e);
            return false;
        }
    },

    updateNavbar() {
        const navAuth = document.getElementById('navAuthSection');
        if (!navAuth) return;

        // Current City
        const currentCity = Auth.getCity();

        // City Selector Dropdown HTML
        const citySelectorHtml = `

                    <li><a class="dropdown-item ${currentCity==='Mumbai'?'active':''}" href="javascript:void(0)" onclick="Auth.setCity('Mumbai')">Mumbai</a></li>
                    <li><a class="dropdown-item ${currentCity==='Pune'?'active':''}" href="javascript:void(0)" onclick="Auth.setCity('Pune')">Pune</a></li>
                    <li><a class="dropdown-item ${currentCity==='Delhi-NCR'?'active':''}" href="javascript:void(0)" onclick="Auth.setCity('Delhi-NCR')">Delhi-NCR</a></li>
                    <li><a class="dropdown-item ${currentCity==='Bengaluru'?'active':''}" href="javascript:void(0)" onclick="Auth.setCity('Bengaluru')">Bengaluru</a></li>
                </ul>
            </li>
        `;

        if (Auth.isLoggedIn()) {
            const user = Auth.getUser();
            const adminLink = Auth.isAdmin() 
                ? `<li class="nav-item"><a class="nav-link text-warning fw-bold" href="admin-dashboard.html"><i class="bi bi-speedometer2"></i> Admin Panel</a></li>`

            navAuth.innerHTML = `
                ${citySelectorHtml}
                ${adminLink}
                <li class="nav-item">
                    <a class="nav-link" href="my-bookings.html"><i class="bi bi-ticket-perforated"></i> My Bookings</a>

                <li class="nav-item dropdown">

                        <i class="bi bi-person-circle text-danger"></i> ${user.fullName || user.email}
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
                        <li><span class="dropdown-item-text text-muted small">${user.email} (${user.role})</span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="watchlist.html"><i class="bi bi-bookmark-heart text-danger"></i> My Watchlist</a></li>
                        <li><a class="dropdown-item" href="compare.html"><i class="bi bi-arrow-left-right text-info"></i> Compare Movies</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="Auth.logout()"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                    </ul>

            `;
        } else {
            navAuth.innerHTML = `
                ${citySelectorHtml}
                <li class="nav-item">
                    <a class="nav-link text-warning fw-bold" href="admin-dashboard.html"><i class="bi bi-shield-lock-fill"></i> Admin Panel</a>

                <li class="nav-item">

                <li class="nav-item">
                    <a class="nav-link" href="login.html"><i class="bi bi-box-arrow-in-right"></i> Login</a>

                <li class="nav-item">
                    <a class="btn btn-cinema btn-sm ms-2" href="register.html">Register</a>

            `;
        }

};

</script>
    <script>
        let bookingData = null;
        let appliedCoupon = null; // { code, discount }
        const snacksCatalog = [
            { id: 'popcorn', name: 'Caramel Tub Popcorn', price: 190, image: 'popcorn.jpg', desc: 'Fresh & Crunchy Golden Caramel' },
            { id: 'pepsi', name: 'Pepsi Large (600ml)', price: 110, image: 'pepsi.jpg', desc: 'Chilled Fizzy Soda with Ice' },
            { id: 'nachos', name: 'Cheesy Nachos with Dip', price: 210, image: 'nachos.jpg', desc: 'Crispy Tortilla with Warm Cheese Dip' },
            { id: 'combo', name: 'Mega Combo (Popcorn + 2 Drinks)', price: 340, image: 'combo.jpg', desc: 'Blockbuster Value Pack for Two' },
            { id: 'burger', name: 'Crispy Multiplex Burger', price: 180, image: 'burger.jpg', desc: 'Grilled Veg/Paneer with Mayo' },
            { id: 'coffee', name: 'Iced Cold Coffee', price: 140, image: 'coffee.jpg', desc: 'Rich Frothy Coffee with Choco Sprinkles' }
        ];
        let snacksSelected = { popcorn: 0, pepsi: 0, nachos: 0, combo: 0, burger: 0, coffee: 0 };

        document.addEventListener('DOMContentLoaded', () => {
            if (!Auth.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }

            const raw = sessionStorage.getItem('pendingBooking');
            if (!raw) {
                window.location.href = 'index.html';
                return;
            }

            bookingData = JSON.parse(raw);
            renderSummary();
        });

        function renderSummary() {
            const show = bookingData.show;
            const ticketCount = bookingData.seatIds.length;
            const convenienceFee = ticketCount * 30.00;

            let snacksTotal = 0;
            snacksCatalog.forEach(s => {
                snacksTotal += snacksSelected[s.id] * s.price;
            });

            const discount = appliedCoupon ? appliedCoupon.discount : 0;
            const subtotalPlusSnacks = bookingData.subTotal + convenienceFee + snacksTotal;
            const totalAmount = Math.max(0, subtotalPlusSnacks - discount);

            // Save to pendingBooking
            bookingData.convenienceFee = convenienceFee;
            bookingData.snacksTotal = snacksTotal;
            bookingData.snacks = snacksSelected;
            bookingData.discountAmount = discount;
            bookingData.couponCode = appliedCoupon ? appliedCoupon.code : null;
            bookingData.totalAmount = totalAmount;
            sessionStorage.setItem('pendingBooking', JSON.stringify(bookingData));

            const showDateStr = new Date(show.showDate).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
            const timeStr = show.startTime.substring(0, 5);

            document.getElementById('summaryCardBody').innerHTML = `
                <div class="row g-4 mb-4">
                    <div class="col-md-3 text-center">
                        <img src="${show.moviePosterUrl}" class="rounded-3 shadow w-100" style="max-height: 230px; object-fit: cover;" alt="${show.movieTitle}" onerror="this.src='default_poster.svg'">
                    </div>
                    <div class="col-md-9">
                        <h3 class="fw-bold text-light mb-1">${show.movieTitle}</h3>
                        <p class="text-danger fw-bold mb-2"><i class="bi bi-geo-alt"></i> ${show.theatreName} (${show.theatreCity})</p>
                        <div class="text-muted small mb-3">
                            <div><i class="bi bi-display"></i> <strong>Screen:</strong> ${show.screenName}</div>
                            <div><i class="bi bi-calendar"></i> <strong>Date:</strong> ${showDateStr}</div>
                            <div><i class="bi bi-clock"></i> <strong>Time:</strong> ${timeStr}</div>
                        </div>
                        <div class="p-2 px-3 rounded bg-black border border-secondary d-inline-block">
                            <span class="text-muted small">Selected Seats:</span>
                            <span class="text-warning fw-bold fs-6 ms-2">${bookingData.seatCodes.join(', ')}</span>
                            <span class="badge bg-secondary ms-2">${ticketCount} Ticket(s)</span>
                        </div>
                    </div>
                </div>

                <hr class="border-secondary my-4">

                <!-- UNIQUE FEATURE 5: F&B Snacks Section -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold text-light mb-0"><i class="bi bi-cup-straw text-warning"></i> Cinema Food &amp; Combos</h5>
                        <span class="badge bg-dark border border-secondary text-warning small">Optional Add-on</span>
                    </div>

                    <div class="row g-3">
                        ${snacksCatalog.map(item => `
                            <div class="col-sm-6">
                                <div class="p-2 px-3 bg-black rounded-3 border border-secondary d-flex justify-content-between align-items-center shadow-sm">
                                    <div class="d-flex align-items-center gap-3">
                                        <img src="${item.image}" alt="${item.name}" class="rounded-3 shadow" style="width: 58px; height: 58px; object-fit: cover; border: 1px solid #334155;">
                                        <div>
                                            <div class="fw-bold text-light small">${item.name}</div>
                                            <div class="text-secondary" style="font-size: 0.72rem;">${item.desc}</div>
                                            <div class="text-success small fw-bold mt-0.5">₹${item.price}</div>
                                        </div>
                                    </div>
                                    <div class="d-flex align-items-center gap-2">
                                        <button class="btn btn-sm btn-outline-secondary px-2 py-0 fw-bold" onclick="changeSnack('${item.id}', -1)">-</button>
                                        <span class="fw-bold text-light small px-1" id="count-${item.id}">${snacksSelected[item.id] || 0}</span>
                                        <button class="btn btn-sm btn-outline-secondary px-2 py-0 fw-bold" onclick="changeSnack('${item.id}', 1)">+</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <hr class="border-secondary my-4">

                <!-- UNIQUE FEATURE 6: Offers & Coupons -->
                <div class="mb-4">
                    <h5 class="fw-bold text-light mb-3"><i class="bi bi-tag text-danger"></i> Offers &amp; Promo Coupons</h5>
                    
                    <div class="input-group mb-2">
                        <input type="text" id="couponInput" class="form-control bg-black text-light border-secondary text-uppercase" placeholder="Enter coupon code (e.g. FIRSTBOOK)" value="${appliedCoupon ? appliedCoupon.code : ''}" ${appliedCoupon ? 'disabled' : ''}>
                        ${appliedCoupon ? `
                            <button class="btn btn-outline-danger" onclick="removeCoupon()">Remove</button>
                        ` : `
                            <button class="btn btn-cinema" onclick="applyCoupon()">Apply Coupon</button>
                        `}
                    </div>

                    <div id="couponMessage" class="${appliedCoupon ? 'text-success fw-bold' : 'text-muted'} small mb-2">
                        ${appliedCoupon ? `<i class="bi bi-check-circle-fill"></i> ${appliedCoupon.message}` : 'Click a popular coupon code to apply:'}
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <span class="badge bg-black border border-secondary text-light p-2" style="cursor: pointer;" onclick="quickCoupon('FIRSTBOOK')">🏷️ FIRSTBOOK (20% OFF)</span>
                        <span class="badge bg-black border border-secondary text-light p-2" style="cursor: pointer;" onclick="quickCoupon('MOVIE50')">🏷️ MOVIE50 (Flat ₹50 OFF)</span>
                        <span class="badge bg-black border border-secondary text-light p-2" style="cursor: pointer;" onclick="quickCoupon('WEEKEND')">🏷️ WEEKEND (15% OFF)</span>
                    </div>
                </div>

                <hr class="border-secondary my-4">

                <!-- Price Breakdown -->
                <h5 class="fw-bold text-light mb-3">Payment Summary</h5>
                <div class="bg-black p-3 rounded-3 border border-secondary mb-4">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Tickets Subtotal (${ticketCount} seats)</span>
                        <span class="text-light fw-bold">₹${bookingData.subTotal.toFixed(2)}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Convenience Fee (₹30 / ticket)</span>
                        <span class="text-light">₹${convenienceFee.toFixed(2)}</span>
                    </div>
                    ${snacksTotal > 0 ? `
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Food &amp; Beverage Combos</span>
                            <span class="text-warning fw-bold">+ ₹${snacksTotal.toFixed(2)}</span>
                        </div>
                    ` : ''}
                    ${discount > 0 ? `
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-success fw-bold">Promo Coupon Discount (${appliedCoupon.code})</span>
                            <span class="text-success fw-bold">- ₹${discount.toFixed(2)}</span>
                        </div>
                    ` : ''}
                    <hr class="border-secondary my-2">
                    <div class="d-flex justify-content-between fs-5 fw-bold">
                        <span class="text-light">Total Amount Payable</span>
                        <span class="text-success">₹${totalAmount.toFixed(2)}</span>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="seat-selection.html?showId=${show.id}" class="btn btn-cinema-outline"><i class="bi bi-arrow-left"></i> Change Seats</a>
                    <a href="payment.html" class="btn btn-cinema btn-lg px-4"><i class="bi bi-credit-card"></i> Proceed to Payment</a>
                </div>
            `;
        }

        function changeSnack(id, delta) {
            const current = snacksSelected[id] || 0;
            const updated = Math.max(0, current + delta);
            snacksSelected[id] = updated;
            renderSummary();
        }

        function quickCoupon(code) {
            document.getElementById('couponInput').value = code;
            applyCoupon();
        }

        async function applyCoupon() {
            const code = document.getElementById('couponInput').value.trim().toUpperCase();
            if (!code) return;

            try {
                const res = await apiCall('/coupons/validate', 'POST', { code: code, subTotal: bookingData.subTotal });
                if (res.valid) {
                    appliedCoupon = { code: res.code, discount: res.discountAmount, message: res.message };
                } else {
                    appliedCoupon = null;
                    alert(res.message || "Invalid coupon.");
                }
                renderSummary();
            } catch (err) {
                alert(err.message || "Failed to validate coupon.");
            }
        }

        function removeCoupon() {
            appliedCoupon = null;
            renderSummary();
        }
    </script>
</body>
</html>
