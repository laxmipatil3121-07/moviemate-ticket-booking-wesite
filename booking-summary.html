    <style>
:root {
    --primary-color: #e50914;
    --primary-hover: #b80710;
    --dark-bg: #0b0f19;
    --card-bg: #151c2e;
    --card-border: #232d42;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-gold: #f59e0b;

    --seat-selected: #10b981;
    --seat-booked: #ef4444;
}

body {
    background-color: var(--dark-bg);
    color: var(--text-main);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Custom Scrollbar */
::-webkit-scrollbar {
    width: 8px;
}
::-webkit-scrollbar-track {
    background: #0f172a;
}
::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 4px;
}

/* Navbar */
.navbar-custom {
    background-color: rgba(11, 15, 25, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--card-border);
    padding: 0.8rem 0;
}

.navbar-brand {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary-color) !important;
    letter-spacing: 0.5px;
}

.nav-link {
    color: #cbd5e1 !important;
    font-weight: 500;
    margin: 0 0.3rem;
    transition: color 0.2s;
}

.nav-link:hover, .nav-link.active {
    color: var(--primary-color) !important;
}

/* Hero Section with Avengers Cinematic Theme */
.hero-banner {
    position: relative;
    background: linear-gradient(180deg, rgba(11, 15, 25, 0.72) 0%, rgba(11, 15, 25, 0.88) 65%, var(--dark-bg) 100%),
                url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1600&q=80') no-repeat center center / cover;
    padding: 6.5rem 0 4.5rem 0;
    border-bottom: 1px solid var(--card-border);
    box-shadow: inset 0 -35px 50px rgba(11, 15, 25, 0.95);
    overflow: hidden;
}

.hero-banner h1 {
    text-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
    letter-spacing: -0.5px;
}

.hero-banner p {
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
}

.hero-avengers-badge {
    background: linear-gradient(90deg, #e50914, #7c3aed);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
}

/* Movie Cards */
.movie-card {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.movie-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(229, 9, 20, 0.2);
    border-color: #3b4866;
}

.movie-poster {
    height: 340px;
    object-fit: cover;
    width: 100%;
    background-color: #1e293b;
}

.movie-card .card-body {
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.movie-card .badge-rating {
    background-color: rgba(245, 158, 11, 0.15);
    color: var(--accent-gold);
    border: 1px solid rgba(245, 158, 11, 0.3);
    font-weight: 600;
}

.badge-genre {
    background-color: #1e293b;
    color: #94a3b8;
    font-size: 0.75rem;
    margin-right: 0.3rem;
    margin-bottom: 0.3rem;
    display: inline-block;
}

/* Buttons */
.btn-cinema {
    background-color: var(--primary-color);
    color: #fff;
    border: none;
    font-weight: 600;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    transition: background-color 0.2s, transform 0.1s;
}

.btn-cinema:hover {
    background-color: var(--primary-hover);
    color: #fff;
}

.btn-cinema-outline {
    background: transparent;
    color: var(--text-main);
    border: 1px solid var(--card-border);
    font-weight: 500;
    border-radius: 8px;
}

.btn-cinema-outline:hover {
    background: #1e293b;
    color: #fff;
    border-color: #475569;
}

/* Seat Selection Grid */
.screen-indicator {
    width: 80%;
    height: 8px;
    background: linear-gradient(90deg, transparent, #38bdf8, transparent);
    margin: 2rem auto 0.5rem auto;
    border-radius: 50%;
    box-shadow: 0 4px 15px rgba(56, 189, 248, 0.5);
}

.seat {
    width: 34px;
    height: 32px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease, background-color 0.15s;
    margin: 4px;
}

.seat.available {
    background-color: var(--seat-available);
    color: #cbd5e1;
    border: 1px solid #475569;
}

.seat.available:hover {
    background-color: #475569;
    transform: scale(1.1);
}

.seat.selected {
    background-color: var(--seat-selected) !important;
    color: #fff !important;
    border: 1px solid #059669 !important;
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);

.seat.booked {
    background-color: #241416 !important;
    color: #64748b !important;
    border: 1px solid #451a1e !important;
    cursor: not-allowed;
    opacity: 0.6;
}

/* Footer */
footer {

    background-color: #080c14;
    border-top: 1px solid var(--card-border);
    padding: 2rem 0;
    color: var(--text-muted);

/* Cinema Live Sync Keyframes */
@keyframes spinSync {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.spin-animation {
    animation: spinSync 0.8s linear infinite;
    display: inline-block;
}

.live-pulse-badge {
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
}

</style>

    <script>
const API_BASE_URL = window.location.origin && window.location.origin.startsWith('http')
    ? `${window.location.origin}/api`
    : 'http://localhost:5000/api';

/**
 * Universal Fetch Helper for API Requests with Static Hosting Fallback
 */
async function apiCall(endpoint, method = 'GET', body = null, requiresAuth = false) {
    const headers = { 'Content-Type': 'application/json' };

    if (requiresAuth) {
        const token = localStorage.getItem('token');
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }
    }

    const config = { method, headers };
    if (body) {
        config.body = JSON.stringify(body);
    }

    try {
        const response = await fetch(`${API_BASE_URL}${endpoint}`, config);
        if (response.ok) {
            return await response.json().catch(() => null);
        }
        // If 404 or server error on static host (e.g. GitHub Pages), fallback to mock
        if (response.status === 404 || response.status >= 500) {
            return MockService.handle(endpoint, method, body);
        }
        const data = await response.json().catch(() => null);
        throw new Error(data?.message || 'Something went wrong.');
    } catch (error) {
        // Network error (backend not running or deployed on static host) -> use seamless mock
        console.warn(`[MovieMate API] Backend unreachable at ${endpoint}, serving offline/demo data.`);
        return MockService.handle(endpoint, method, body);
    }
}

        { id: 2, name: "INOX - Megaplex Inorbit Mall", city: "Mumbai", address: "Malad West, Mumbai, MH", screens: [{ id: 2, screenName: "Insignia Screen 1", totalSeats: 48 }] }
    ],

    getShows(targetMovieId = null) {
        const todayStr = new Date().toISOString().split('T')[0];
        const showList = [];
        let idCounter = 1;
        const slots = [
            { start: "10:30:00", end: "13:30:00", price: 200 },
            { start: "14:15:00", end: "17:15:00", price: 240 },
            { start: "18:30:00", end: "21:30:00", price: 290 },
            { start: "22:00:00", end: "01:00:00", price: 260 }
        ];

        MockService.theatres.forEach(t => {
            t.screens.forEach((s, sIdx) => {
                slots.forEach((slot, slotIdx) => {
                    const nowShowing = MockService.movies.filter(m => m.status === 'Now Showing');
                    const movie = targetMovieId 
                        ? (MockService.movies.find(m => m.id === targetMovieId) || nowShowing[0])
                        : nowShowing[(sIdx + slotIdx) % nowShowing.length];

                    const sid = idCounter++;
                    showList.push({
                        id: sid,
                        showId: sid,
                        movieId: movie.id,
                        movieTitle: movie.title,
                        screenId: s.id,
                        screenName: s.screenName,
                        theatreId: t.id,
                        theatreName: t.name,
                        theatreCity: t.city,
                        city: t.city,
                        showDate: todayStr,
                        startTime: slot.start,
                        endTime: slot.end,
                        basePrice: slot.price
                    });
                });
            });
        });
        return showList;
    },

    getSeatLayout(showId) {
        const rows = ['A', 'B', 'C', 'D'];
        const seats = [];
        let idCounter = 1;
        const allShows = MockService.getShows();
        const show = allShows.find(s => s.id === parseInt(showId) || s.showId === parseInt(showId)) || allShows[0];
        const basePrice = show.basePrice || 200;

        rows.forEach(r => {
            for (let num = 1; num <= 12; num++) {
                const type = (r === 'A') ? 'Platinum' : (r === 'B' || r === 'C') ? 'Gold' : 'Silver';
                const mult = (r === 'A') ? 1.4 : (r === 'B' || r === 'C') ? 1.2 : 1.0;
                const seatPrice = Math.round(basePrice * mult);
                const currentId = idCounter++;
                seats.push({
                    id: currentId,
                    seatId: currentId,
                    row: r,
                    seatNumber: num,
                    seatCode: `${r}${num}`,
                    seatType: type,
                    priceMultiplier: mult,
                    price: seatPrice
                });
            }
        });
        const booked = [3, 4, 15, 16, 28, 41];
        return {
            show: show,
            seats: seats,
            bookedSeatIds: booked
        };
    },

        handle(endpoint, method = 'GET', body = null) {
        const clean = endpoint.split('?')[0];

        // 0. Coupon Validation
        if (clean === '/coupons/validate' && method === 'POST') {
            const code = ((body && body.code) ? body.code : (body && body.couponCode) ? body.couponCode : '').toUpperCase().trim();
            const sub = Number(body ? body.subTotal : 0) || 0;
            if (code === 'FIRSTBOOK') {
                return { valid: true, code: 'FIRSTBOOK', discountAmount: Math.round(sub * 0.20), message: 'FIRSTBOOK applied: 20% OFF!' };
            }
            if (code === 'MOVIE50') {
                return { valid: true, code: 'MOVIE50', discountAmount: Math.min(50, sub), message: 'MOVIE50 applied: Flat ₹50 OFF!' };
            }
            if (code === 'WEEKEND') {
                return { valid: true, code: 'WEEKEND', discountAmount: Math.round(sub * 0.15), message: 'WEEKEND applied: 15% OFF!' };
            }
            if (code === 'VIP75') {
                return { valid: true, code: 'VIP75', discountAmount: Math.min(75, sub), message: 'VIP75 applied: Flat ₹75 OFF!' };
            }
            if (code === 'FREECOMBO') {
                return { valid: true, code: 'FREECOMBO', discountAmount: Math.min(60, sub), message: 'FREECOMBO applied: Flat ₹60 Snack Discount!' };
            }
            if (code === 'JACKPOT30') {
                return { valid: true, code: 'JACKPOT30', discountAmount: Math.round(sub * 0.30), message: 'JACKPOT30 applied: Mega 30% Discount!' };
            }
            return { valid: false, message: 'Invalid coupon code.' };
        }

        // 1. Genres
        if (clean === '/genres') {
            return [
                { id: 1, name: "Action" },
                { id: 2, name: "Sci-Fi" },
                { id: 3, name: "Drama" },
                { id: 4, name: "Comedy" },
                { id: 5, name: "Thriller" },
                { id: 6, name: "Adventure" },
                { id: 7, name: "Horror" },
                { id: 9, name: "Romance" }
            ];
        }

        // 2. AI Recommendations (Top rated Now Showing)
        if (clean === '/movies/recommended') {
            return MockService.movies
                .filter(m => m.status === 'Now Showing')
                .sort((a, b) => b.rating - a.rating)
                .slice(0, 4);
        }

        // 3. Mood Discovery
        if (clean === '/movies/mood') {
            const queryStr = endpoint.includes('?') ? endpoint.split('?')[1] : '';
            const urlParams = new URLSearchParams(queryStr);
            const mood = (urlParams.get('mood') || '').toLowerCase();
            return MockService.movies.filter(m => {
                const genres = (m.genres || []).map(g => g.name.toLowerCase());
                if (mood.includes('action')) return genres.includes('action');
                if (mood.includes('comedy')) return genres.includes('comedy');
                if (mood.includes('horror') || mood.includes('thrill')) return genres.includes('horror') || genres.includes('thriller');
                if (mood.includes('sci-fi') || mood.includes('future')) return genres.includes('sci-fi');
                if (mood.includes('drama') || mood.includes('emotion')) return genres.includes('drama');
                if (mood.includes('romance')) return genres.includes('romance');
                return true;
            });
        }

        // 4. Typeahead Search
        if (clean === '/movies/suggestions') {
            const queryStr = endpoint.includes('?') ? endpoint.split('?')[1] : '';
            const urlParams = new URLSearchParams(queryStr);
            const q = (urlParams.get('q') || '').toLowerCase();
            if (!q) return [];
            return MockService.movies
                .filter(m => m.title.toLowerCase().includes(q))
                .slice(0, 5)
                .map(m => ({
                    id: m.id,
                    title: m.title,
                    subtitle: `${m.language} • ${m.status}`,
                    type: 'Movie',
                    url: `movie-details.html?id=${m.id}`
                }));
        }

        // 5. Watchlist
        if (clean === '/watchlist' || clean.startsWith('/watchlist/')) {
            let stored = [];
            try { stored = JSON.parse(localStorage.getItem('moviemate_watchlist') || '[]'); } catch(e) {}
            if (clean.startsWith('/watchlist/check/')) {
                const checkId = parseInt(clean.replace('/watchlist/check/', ''));
                return stored.includes(checkId);
            }
            if (method === 'POST') {
                const addId = parseInt(clean.replace('/watchlist/', ''));
                if (!isNaN(addId)) {
                    const idx = stored.indexOf(addId);
                    let inWatchlist = false;
                    if (idx === -1) {
                        stored.push(addId);
                        inWatchlist = true;
                    } else {
                        stored.splice(idx, 1);
                        inWatchlist = false;
                    }
                    localStorage.setItem('moviemate_watchlist', JSON.stringify(stored));
                    return { inWatchlist: inWatchlist, message: inWatchlist ? 'Added to watchlist' : 'Removed from watchlist' };
                }
                return { inWatchlist: false };
            }
            if (method === 'DELETE') {
                const delId = parseInt(clean.replace('/watchlist/', ''));
                stored = stored.filter(id => id !== delId);
                localStorage.setItem('moviemate_watchlist', JSON.stringify(stored));
                return { success: true };
            }
            return MockService.movies.filter(m => stored.includes(m.id));
        }

        // 6. Reviews
        if (clean.includes('/reviews')) {
            if (method === 'POST') {
                return { success: true, message: 'Review submitted successfully!' };
            }
            return [
                { id: 1, userName: "Aarav Sharma", rating: 5, reviewText: "Mindblowing cinematic visual experience! Worth every penny.", createdAt: new Date().toISOString() },
                { id: 2, userName: "Sneha Patil", rating: 4, reviewText: "Superb storytelling and brilliant background score. Must watch with family!", createdAt: new Date().toISOString() }
            ];
        }

        // 7. Movies catalog endpoints
        if (clean === '/movies' || clean === '/movies/featured') {
            const queryStr = endpoint.includes('?') ? endpoint.split('?')[1] : '';
            if (!queryStr) return MockService.movies;
            const params = new URLSearchParams(queryStr);
            const search = (params.get('search') || '').toLowerCase();
            const genreId = params.get('genreId');
            const status = (params.get('status') || '').toLowerCase();

            return MockService.movies.filter(m => {
                if (search && !m.title.toLowerCase().includes(search) && !(m.cast && m.cast.toLowerCase().includes(search))) return false;
                if (genreId && !(m.genres && m.genres.some(g => String(g.id) === String(genreId)))) return false;
                if (status && m.status.toLowerCase() !== status) return false;
                return true;
            });
        }
        if (clean.startsWith('/movies/')) {
            const id = parseInt(clean.replace('/movies/', ''));
            if (!isNaN(id)) {
                const m = MockService.movies.find(x => x.id === id) || MockService.movies[0];
                const shows = MockService.getShows(m.id);
                return {
                    ...m,
                    shows: shows,
                    availableShows: shows
                };
            }
        }

        // 8. Theatres endpoints
        if (clean === '/theatres') {
            return MockService.theatres;
        }

        // 9. Shows endpoints & Live Seat Layout
        if (clean.includes('/live-status')) {
            const parts = clean.split('/');
            const showId = parseInt(parts[2]) || 1;
            const layout = MockService.getSeatLayout(showId);
            const seats = layout.seats.map(st => ({
                ...st,
                isBooked: layout.bookedSeatIds.includes(st.id)
            }));
            return {
                partnerName: "PVR-INOX Vista Cinema POS Gateway v4.2",
                status: "Connected (Live)",
                latencyMs: 14,
                priceTag: "Standard",
                dynamicBasePrice: layout.show.basePrice,
                basePrice: layout.show.basePrice,
                totalSeats: 48,
                bookedSeats: layout.bookedSeatIds.length,
                occupancyPercentage: Math.round((layout.bookedSeatIds.length / 48) * 100),
                occupancyStatus: "Available",
                seats: seats,
                seatLayout: layout,
                show: layout.show
            };
        }
        if (clean.includes('/seat-layout')) {
            const showId = clean.split('/')[2];
            return MockService.getSeatLayout(showId);
        }
        if (clean.startsWith('/shows/')) {
            const showId = parseInt(clean.replace('/shows/', ''));
            if (!isNaN(showId)) {
                const allShows = MockService.getShows();
                return allShows.find(s => s.id === showId || s.showId === showId) || allShows[0];
            }
        }
        if (clean === '/shows') {
            return MockService.getShows();
        }

        // 10. Auth
        if (clean === '/auth/login' || clean === '/auth/register') {
            const email = body?.email || 'user@movieticket.com';
            const role = email.includes('admin') ? 'Admin' : 'User';
            const name = body?.fullName || (role === 'Admin' ? 'System Administrator' : 'Rahul Sharma');
            return {
                token: 'mock-jwt-token-preview',
                email: email,
                fullName: name,
                role: role
            };
        }

        // 11. Admin Dashboard & Bookings
        if (clean === '/admin/dashboard') {
            return {
                totalRevenue: 52400.00,
                totalBookings: 184,
                totalMovies: MockService.movies.length,
                totalUsers: 142,
                recentBookings: [
                    { bookingNumber: "MM-984321", customerName: "Rahul Sharma", movieTitle: "Stree 2: Sarkate Ka Aatank", seats: ["A4", "A5"], totalAmount: 640.00, status: "Confirmed" },
                    { bookingNumber: "MM-984320", customerName: "Pooja Patil", movieTitle: "Kalki 2898 AD", seats: ["B6", "B7"], totalAmount: 580.00, status: "Confirmed" },
                    { bookingNumber: "MM-984319", customerName: "Amit Joshi", movieTitle: "Deadpool & Wolverine", seats: ["C10"], totalAmount: 290.00, status: "Confirmed" }
                ],
                topMovies: [
                    { title: "Stree 2: Sarkate Ka Aatank", bookingsCount: 68 },
                    { title: "Kalki 2898 AD", bookingsCount: 52 },
                    { title: "Pushpa 2: The Rule", bookingsCount: 41 }
                ],
                popularMovies: [
                    { movieTitle: "Stree 2: Sarkate Ka Aatank", bookingsCount: 68, totalSales: 16320 },
                    { movieTitle: "Kalki 2898 AD", bookingsCount: 52, totalSales: 12480 },
                    { movieTitle: "Pushpa 2: The Rule", bookingsCount: 41, totalSales: 9840 }
                ]
            };
        }

        if (clean === '/admin/bookings' || clean.includes('/bookings/my')) {
            let myBookings = [];
            try {
                const stored = JSON.parse(localStorage.getItem('moviemate_last_booking') || 'null');
                if (stored) myBookings.push(stored);
            } catch(e) {}
            if (myBookings.length === 0) {
                myBookings = [
                    { bookingNumber: "MM-984321", customerName: "Rahul Sharma", customerEmail: "user@movieticket.com", movieTitle: "Stree 2: Sarkate Ka Aatank", theatreName: "INOX - Khandesh Central Mall", screenName: "Laser 4K", showDate: new Date().toISOString(), startTime: "18:30:00", seats: ["A4", "A5"], totalAmount: 640.00, paymentMethod: "UPI", status: "Confirmed" }
                ];
            }
            return myBookings;
        }

        // 12. Create Booking
        if (clean === '/bookings' && method === 'POST') {
            const bookingNum = "MM-" + Math.floor(100000 + Math.random() * 900000);
            const newBooking = {
                id: Math.floor(Math.random() * 10000),

                message: "Booking confirmed successfully!"
            };
            try {
                localStorage.setItem('moviemate_last_booking', JSON.stringify(newBooking));
            } catch(e) {}
            return newBooking;
        }

        // Default empty fallback
        return [];
    }
};

                            <span class="text-warning fw-bold fs-6 ms-2">${bookingData.seatCodes.join(', ')}</span>
                            <span class="badge bg-secondary ms-2">${ticketCount} Ticket(s)</span>
                        </div>
                    </div>
                </div>

                <hr class="border-secondary my-4">

                <!-- UNIQUE FEATURE 5: F&B Snacks Section -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold text-light mb-0"><i class="bi bi-cup-straw text-warning"></i> Cinema Food &amp; Combos</h5>
                        <span class="badge bg-dark border border-secondary text-warning small">Optional Add-on</span>
                    </div>

                    <div class="row g-3">
                        ${snacksCatalog.map(item => `
                            <div class="col-sm-6">
                                <div class="p-2 px-3 bg-black rounded-3 border border-secondary d-flex justify-content-between align-items-center shadow-sm">
                                    <div class="d-flex align-items-center gap-3">
                                        <img src="${item.image}" alt="${item.name}" class="rounded-3 shadow" style="width: 58px; height: 58px; object-fit: cover; border: 1px solid #334155;">
                                        <div>
                                            <div class="fw-bold text-light small">${item.name}</div>
                                            <div class="text-secondary" style="font-size: 0.72rem;">${item.desc}</div>
                                            <div class="text-success small fw-bold mt-0.5">₹${item.price}</div>
                                        </div>
                                    </div>
                                    <div class="d-flex align-items-center gap-2">
                                        <button class="btn btn-sm btn-outline-secondary px-2 py-0 fw-bold" onclick="changeSnack('${item.id}', -1)">-</button>
                                        <span class="fw-bold text-light small px-1" id="count-${item.id}">${snacksSelected[item.id] || 0}</span>
                                        <button class="btn btn-sm btn-outline-secondary px-2 py-0 fw-bold" onclick="changeSnack('${item.id}', 1)">+</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <hr class="border-secondary my-4">

                <!-- UNIQUE FEATURE 6: Offers & Coupons -->
                <div class="mb-4">
                    <h5 class="fw-bold text-light mb-3"><i class="bi bi-tag text-danger"></i> Offers &amp; Promo Coupons</h5>
                    <!-- Lucky Spin Banner in Checkout -->
                    <div class="p-3 mb-3 rounded-3 border border-warning d-flex justify-content-between align-items-center flex-wrap gap-2" style="background: rgba(245, 158, 11, 0.12);">
                        <div class="d-flex align-items-center gap-2">
                            <span class="fs-3">ðŸŽ¡</span>
                            <div>
                                <div class="fw-bold text-light small"><span class="badge bg-warning text-dark me-1">LUCKY DRAW</span>Spin Wheel &amp; Win Instant Discount!</div>
                                <div class="text-secondary" style="font-size: 0.76rem;">Win up to 30% OFF or Flat ₹75 discount right now for this booking.</div>
                            </div>
                        </div>
                        <button class="btn btn-warning btn-sm fw-bold text-dark px-3" onclick="openSpinWheelModal()">
                            <i class="bi bi-play-circle-fill"></i> Spin Now
                        </button>
                    </div>
                    
                    <div class="input-group mb-2">
                        <input type="text" id="couponInput" class="form-control bg-black text-light border-secondary text-uppercase" placeholder="Enter coupon code (e.g. FIRSTBOOK)" value="${appliedCoupon ? appliedCoupon.code : ''}" ${appliedCoupon ? 'disabled' : ''}>
                        ${appliedCoupon ? `
                            <button class="btn btn-outline-danger" onclick="removeCoupon()">Remove</button>
                        ` : `
                            <button class="btn btn-cinema" onclick="applyCoupon()">Apply Coupon</button>
                        `}
                    </div>

                    <div id="couponMessage" class="${appliedCoupon ? 'text-success fw-bold' : 'text-muted'} small mb-2">
                        ${appliedCoupon ? `<i class="bi bi-check-circle-fill"></i> ${appliedCoupon.message}` : 'Click a popular coupon code to apply:'}
                    </div>

                    <div class="d-flex flex-wrap gap-2">
                        <span class="badge bg-black border border-secondary text-light p-2" style="cursor: pointer;" onclick="quickCoupon('FIRSTBOOK')">🏷️ FIRSTBOOK (20% OFF)</span>
                        <span class="badge bg-black border border-secondary text-light p-2" style="cursor: pointer;" onclick="quickCoupon('MOVIE50')">🏷️ MOVIE50 (Flat ₹50 OFF)</span>
                        <span class="badge bg-black border border-secondary text-light p-2" style="cursor: pointer;" onclick="quickCoupon('WEEKEND')">🏷️ WEEKEND (15% OFF)</span>
                    </div>
                </div>

                <hr class="border-secondary my-4">

                <!-- Price Breakdown -->
                <h5 class="fw-bold text-light mb-3">Payment Summary</h5>
                <div class="bg-black p-3 rounded-3 border border-secondary mb-4">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Tickets Subtotal (${ticketCount} seats)</span>
                        <span class="text-light fw-bold">₹${bookingData.subTotal.toFixed(2)}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Convenience Fee (₹30 / ticket)</span>
                        <span class="text-light">₹${convenienceFee.toFixed(2)}</span>
                    </div>
                    ${snacksTotal > 0 ? `
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Food &amp; Beverage Combos</span>
                            <span class="text-warning fw-bold">+ ₹${snacksTotal.toFixed(2)}</span>
                        </div>
                    ` : ''}
                    ${discount > 0 ? `
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-success fw-bold">Promo Coupon Discount (${appliedCoupon.code})</span>
                            <span class="text-success fw-bold">- ₹${discount.toFixed(2)}</span>
                        </div>
                    ` : ''}
                    <hr class="border-secondary my-2">
                    <div class="d-flex justify-content-between fs-5 fw-bold">
                        <span class="text-light">Total Amount Payable</span>
                        <span class="text-success">₹${totalAmount.toFixed(2)}</span>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="seat-selection.html?showId=${show.id}" class="btn btn-cinema-outline"><i class="bi bi-arrow-left"></i> Change Seats</a>
                    <a href="payment.html" class="btn btn-cinema btn-lg px-4"><i class="bi bi-credit-card"></i> Proceed to Payment</a>
                </div>
            `;
        }

        function changeSnack(id, delta) {
            const current = snacksSelected[id] || 0;
            const updated = Math.max(0, current + delta);
            snacksSelected[id] = updated;
            renderSummary();
        }

        function quickCoupon(code) {
            document.getElementById('couponInput').value = code;
            applyCoupon();
        }

        async function applyCoupon() {
            const code = document.getElementById('couponInput').value.trim().toUpperCase();
            if (!code) return;

            try {
                const res = await apiCall('/coupons/validate', 'POST', { code: code, subTotal: bookingData.subTotal });
                if (res.valid) {
                    appliedCoupon = { code: res.code, discount: res.discountAmount, message: res.message };
                } else {
                    appliedCoupon = null;
                    alert(res.message || "Invalid coupon.");
                }
                renderSummary();
            } catch (err) {
                alert(err.message || "Failed to validate coupon.");
            }
        }

        function removeCoupon() {
            appliedCoupon = null;
            renderSummary();
        }
    </script>
    <!-- Lucky Spin the Wheel Modal -->
    <div class="modal fade" id="spinWheelModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-danger shadow-lg">
                <div class="modal-header border-secondary">
                    <div class="d-flex align-items-center gap-2">
                        <span class="fs-4">ðŸŽ¡</span>
                        <div>
                            <h5 class="modal-title fw-bold text-light mb-0">Lucky Cinema Spin Wheel</h5>
                            <div class="text-muted small">Spin to unlock guaranteed discount promo codes!</div>
                        </div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <div class="spin-wheel-container mb-4">
                        <div class="spin-wheel-pointer"></div>
                        <canvas id="wheelCanvas" width="320" height="320" class="spin-wheel-canvas"></canvas>
                        <button class="spin-wheel-center-btn" id="btnSpinNow" onclick="spinWheel()">SPIN<br>NOW</button>
                    </div>
                    <div id="spinResultBox" class="d-none">
                        <div class="p-3 bg-black rounded-3 border border-success mb-2">
                            <div class="text-success fw-bold fs-5 mb-1" id="spinPrizeTitle">ðŸŽ‰ You Won Flat ₹75 OFF!</div>
                            <p class="text-muted small mb-2" id="spinPrizeDesc">Promo code unlocked</p>
                            <div class="d-flex justify-content-center align-items-center gap-2">
                                <span class="badge bg-danger fs-6 p-2 font-monospace" id="spinWonCoupon">VIP75</span>
                                <button class="btn btn-sm btn-outline-light" id="btnApplyWonCoupon" onclick="applyWonCoupon()">Apply Code</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="spin-wheel.js"></script>
</body>
</html>
