<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MovieMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-film"></i> MovieMate</a>
            <a class="btn btn-sm btn-cinema-outline" href="index.html"><i class="bi bi-arrow-left"></i> Back to Home</a>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card bg-dark border-secondary p-4 shadow-lg rounded-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-light"><i class="bi bi-person-plus text-danger"></i> Create Account</h3>
                        <p class="text-muted small">Join MovieMate to book your favorite movies</p>
                    </div>

                    <div id="alertBox" class="alert d-none" role="alert"></div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label text-light small fw-bold">Full Name</label>
                            <input type="text" class="form-control bg-black text-light border-secondary" id="fullName" required placeholder="John Doe">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light small fw-bold">Email Address</label>
                            <input type="email" class="form-control bg-black text-light border-secondary" id="email" required placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light small fw-bold">Password (min 6 chars)</label>
                            <input type="password" class="form-control bg-black text-light border-secondary" id="password" required minlength="6" placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-cinema w-100 py-2 mt-2 fw-bold" id="btnRegister">
                            <span id="btnText">Sign Up</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                        </button>
                    </form>

                    <div class="text-center mt-4 text-muted small">
                        Already have an account? <a href="login.html" class="text-danger text-decoration-none fw-bold">Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            alertBox.className = 'alert d-none';
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');

            try {
                const res = await apiCall('/auth/register', 'POST', { fullName, email, password });
                Auth.saveSession(res.token, res.email, res.fullName, res.role);

                alertBox.className = 'alert alert-success d-block';
                alertBox.innerText = 'Account created successfully! Redirecting...';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } catch (err) {
                alertBox.className = 'alert alert-danger d-block';
                alertBox.innerText = err.message || 'Registration failed.';
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
