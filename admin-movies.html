<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Movies - MovieMate Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-warning" href="admin-dashboard.html"><i class="bi bi-shield-check"></i> MovieMate Admin</a>
            <a href="index.html" class="btn btn-sm btn-cinema-outline"><i class="bi bi-house"></i> View Website</a>
        </div>
    </nav>

    <div class="container-fluid px-4 my-4">
        <ul class="nav nav-pills mb-4 bg-black p-2 rounded-3 border border-secondary">
            <li class="nav-item"><a class="nav-link text-light" href="admin-dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active text-light" href="admin-movies.html"><i class="bi bi-film"></i> Manage Movies</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="admin-shows.html"><i class="bi bi-clock-history"></i> Schedule Shows</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="admin-bookings.html"><i class="bi bi-receipt"></i> All Bookings</a></li>
        </ul>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-light mb-0"><i class="bi bi-film text-danger"></i> Movie Catalog Management</h3>
            <button class="btn btn-cinema" data-bs-toggle="modal" data-bs-target="#addMovieModal"><i class="bi bi-plus-lg"></i> Add New Movie</button>
        </div>

        <div class="card bg-dark border-secondary rounded-4 shadow p-4">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr class="text-muted small">
                            <th>Poster</th>
                            <th>Title</th>
                            <th>Language</th>
                            <th>Duration</th>
                            <th>Rating</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="moviesTableBody">
                        <tr><td colspan="7" class="text-center py-4">Loading movies...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Movie Modal -->
    <div class="modal fade" id="addMovieModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary text-light">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold"><i class="bi bi-film text-danger"></i> Add New Movie</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="addMovieForm">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label small fw-bold">Movie Title</label>
                                <input type="text" class="form-control bg-black text-light border-secondary" id="mTitle" required placeholder="e.g. Gladiator II">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Status</label>
                                <select class="form-select bg-black text-light border-secondary" id="mStatus">
                                    <option value="Now Showing">Now Showing</option>
                                    <option value="Upcoming">Upcoming</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Language</label>
                                <input type="text" class="form-control bg-black text-light border-secondary" id="mLanguage" required placeholder="e.g. English, Hindi">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold">Duration (Mins)</label>
                                <input type="number" class="form-control bg-black text-light border-secondary" id="mDuration" required value="120">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold">Rating (0-10)</label>
                                <input type="number" step="0.1" class="form-control bg-black text-light border-secondary" id="mRating" required value="8.0">
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold">Poster Image URL</label>
                                <input type="url" class="form-control bg-black text-light border-secondary" id="mPoster" required placeholder="https://image-link.jpg">
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold">Trailer YouTube URL</label>
                                <input type="url" class="form-control bg-black text-light border-secondary" id="mTrailer" placeholder="https://www.youtube.com/watch?v=...">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Director</label>
                                <input type="text" class="form-control bg-black text-light border-secondary" id="mDirector" placeholder="Director name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Lead Cast</label>
                                <input type="text" class="form-control bg-black text-light border-secondary" id="mCast" placeholder="Actor 1, Actor 2">
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold">Description / Synopsis</label>
                                <textarea class="form-control bg-black text-light border-secondary" id="mDesc" rows="3" required placeholder="Short overview of the movie..."></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-cinema">Save Movie</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const ok = await Auth.ensureAdmin();
            if (!ok) {
                window.location.href = '../login.html';
                return;
            }
            await loadAdminMovies();

            document.getElementById('addMovieForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const payload = {
                    title: document.getElementById('mTitle').value.trim(),
                    status: document.getElementById('mStatus').value,
                    language: document.getElementById('mLanguage').value.trim(),
                    durationMinutes: parseInt(document.getElementById('mDuration').value),
                    rating: parseFloat(document.getElementById('mRating').value),
                    posterUrl: document.getElementById('mPoster').value.trim(),
                    trailerUrl: document.getElementById('mTrailer').value.trim(),
                    director: document.getElementById('mDirector').value.trim(),
                    cast: document.getElementById('mCast').value.trim(),
                    description: document.getElementById('mDesc').value.trim(),
                    genreIds: [1]
                };

                try {
                    await apiCall('/movies', 'POST', payload, true);
                    alert("Movie added successfully!");
                    bootstrap.Modal.getInstance(document.getElementById('addMovieModal')).hide();
                    document.getElementById('addMovieForm').reset();
                    await loadAdminMovies();
                } catch (err) {
                    alert(err.message || "Failed to add movie.");
                }
            });
        });

        async function loadAdminMovies() {
            const tbody = document.getElementById('moviesTableBody');
            try {
                const movies = await apiCall('/movies');
                tbody.innerHTML = movies.map(m => `
                    <tr>
                        <td><img src="${m.posterUrl ? (m.posterUrl.startsWith('http') ? m.posterUrl : '../' + m.posterUrl) : 'https://via.placeholder.com/300x400'}" class="rounded" style="width: 45px; height: 60px; object-fit: cover;"></td>
                        <td class="fw-bold text-light">${m.title}</td>
                        <td>${m.language}</td>
                        <td>${m.durationMinutes}m</td>
                        <td><span class="badge badge-rating">${m.rating.toFixed(1)}</span></td>
                        <td><span class="badge ${m.status === 'Now Showing' ? 'bg-success' : 'bg-warning'}">${m.status}</span></td>
                        <td>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteMovie(${m.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-danger">${err.message}</td></tr>`;
            }
        }

        async function deleteMovie(id) {
            if (!confirm("Are you sure you want to delete this movie?")) return;
            try {
                await apiCall(`/movies/${id}`, 'DELETE', null, true);
                alert("Movie deleted!");
                await loadAdminMovies();
            } catch (err) {
                alert(err.message || "Failed to delete movie.");
            }
        }
    </script>
</body>
</html>
