<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MovieMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-film"></i> MovieMate</a>
            <a class="btn btn-sm btn-cinema-outline" href="index.html"><i class="bi bi-arrow-left"></i> Back to Home</a>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card bg-dark border-secondary p-4 shadow-lg rounded-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-light"><i class="bi bi-shield-lock text-danger"></i> Welcome Back</h3>
                        <p class="text-muted small">Enter your email and password to log in</p>
                    </div>

                    <div id="alertBox" class="alert d-none" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label text-light small fw-bold">Email Address</label>
                            <input type="email" class="form-control bg-black text-light border-secondary" id="email" required placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light small fw-bold">Password</label>
                            <input type="password" class="form-control bg-black text-light border-secondary" id="password" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-cinema w-100 py-2 mt-2 fw-bold" id="btnLogin">
                            <span id="btnText">Sign In</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                        </button>
                    </form>

                    <div class="mt-4 p-3 rounded bg-black border border-secondary text-muted small">
                        <div class="fw-bold text-light mb-2"><i class="bi bi-shield-check text-warning"></i> Demo Quick Login:</div>
                        <div class="d-grid gap-2 mb-2">
                            <button type="button" class="btn btn-warning btn-sm fw-bold" onclick="quickLogin('admin@movieticket.com', 'Admin@12345')">
                                <i class="bi bi-speedometer2"></i> 1-Click Login as Admin
                            </button>
                            <button type="button" class="btn btn-outline-light btn-sm" onclick="quickLogin('user@movieticket.com', 'User@12345')">
                                <i class="bi bi-person"></i> 1-Click Login as User
                            </button>
                        </div>
                        <div class="text-muted" style="font-size: 0.75rem;">
                            Admin: <code>admin@movieticket.com</code> / <code>Admin@12345</code><br>
                            User: <code>user@movieticket.com</code> / <code>User@12345</code>
                        </div>
                    </div>

                    <div class="text-center mt-3 text-muted small">
                        Don't have an account? <a href="register.html" class="text-danger text-decoration-none fw-bold">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function quickLogin(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            alertBox.className = 'alert d-none';
            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');

            try {
                const res = await apiCall('/auth/login', 'POST', { email, password });
                Auth.saveSession(res.token, res.email, res.fullName, res.role);

                alertBox.className = 'alert alert-success d-block';
                alertBox.innerText = 'Login successful! Redirecting...';

                setTimeout(() => {
                    if (res.role === 'Admin') {
                        window.location.href = 'admin/dashboard.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1000);
            } catch (err) {
                alertBox.className = 'alert alert-danger d-block';
                alertBox.innerText = err.message || 'Invalid email or password.';
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
