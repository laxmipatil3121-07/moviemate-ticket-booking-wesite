<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Bookings - MovieMate Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-warning" href="admin-dashboard.html"><i class="bi bi-shield-check"></i> MovieMate Admin</a>
            <a href="index.html" class="btn btn-sm btn-cinema-outline"><i class="bi bi-house"></i> View Website</a>
        </div>
    </nav>

    <div class="container-fluid px-4 my-4">
        <ul class="nav nav-pills mb-4 bg-black p-2 rounded-3 border border-secondary">
            <li class="nav-item"><a class="nav-link text-light" href="admin-dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="admin-movies.html"><i class="bi bi-film"></i> Manage Movies</a></li>
            <li class="nav-item"><a class="nav-link text-light" href="admin-shows.html"><i class="bi bi-clock-history"></i> Schedule Shows</a></li>
            <li class="nav-item"><a class="nav-link active text-light" href="admin-bookings.html"><i class="bi bi-receipt"></i> All Bookings</a></li>
        </ul>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-light mb-0"><i class="bi bi-receipt text-danger"></i> System Bookings Report</h3>
        </div>

        <div class="card bg-dark border-secondary rounded-4 shadow p-4">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0">
                    <thead>
                        <tr class="text-muted small">
                            <th>Booking Ref</th>
                            <th>Customer</th>
                            <th>Movie</th>
                            <th>Cinema</th>
                            <th>Showtime</th>
                            <th>Seats</th>
                            <th>Amount</th>
                            <th>Payment</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="allBookingsTableBody">
                        <tr><td colspan="9" class="text-center py-4">Loading bookings...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const ok = await Auth.ensureAdmin();
            if (!ok) {
                window.location.href = 'login.html';
                return;
            }

            const tbody = document.getElementById('allBookingsTableBody');
            try {
                const bookings = await apiCall('/admin/bookings', 'GET', null, true);
                if (!bookings || bookings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">No bookings found in the system.</td></tr>';
                    return;
                }

                tbody.innerHTML = bookings.map(b => {
                    const dateStr = new Date(b.showDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    return `
                        <tr>
                            <td><span class="badge bg-black border border-secondary">${b.bookingNumber}</span></td>
                            <td>${b.customerName}<br><span class="text-muted small">${b.customerEmail}</span></td>
                            <td class="fw-bold text-light">${b.movieTitle}</td>
                            <td>${b.theatreName} (${b.screenName})</td>
                            <td>${dateStr} @ ${b.startTime.substring(0, 5)}</td>
                            <td><span class="badge bg-secondary">${b.seats.join(', ')}</span></td>
                            <td class="text-success fw-bold">₹${b.totalAmount.toFixed(2)}</td>
                            <td><span class="badge bg-dark border border-secondary">${b.paymentMethod}</span></td>
                            <td><span class="badge ${b.status === 'Confirmed' ? 'bg-success' : 'bg-danger'}">${b.status}</span></td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-danger">${err.message}</td></tr>`;
            }
        });
    </script>
</body>
</html>
